function unifiedSelDefs() {
  return unifiedSel.exams.map(k => EXAM_DEFS.find(d => d.key === k));
}

async function dlUnified(students, mainCols, extraCols) {
  const sel = unifiedSelDefs();
  if (sel.length === 0) return;
  const withGPA = unifiedSel.gpa;
  const paperSel = sel.filter(d => d.key !== 'sem');
  const nRows = sel.length;
  const labels = sel.map(d => d.label);
  const nameLabels = sel.map(d => d.key === 'sem' ? '综合' : d.label); // 命名用短标签
  const showTrend = paperSel.length >= 2;
  const perRowTrend = paperSel.length >= 3;

  const wb = new ExcelJS.Workbook();
  const ws = wb.addWorksheet(nameLabels.join("") + "成绩");
  const FONT = {name:"Arial", size:11};
  const V = "middle";
  const AVG_FMT = '0.0';
  const GREEN_FILL = {type:'pattern', pattern:'solid', fgColor:{argb:'FFD5F5D5'}};
  const RED_FILL = {type:'pattern', pattern:'solid', fgColor:{argb:'FFFFD5D5'}};
  const ORANGE_FILL = {type:'pattern', pattern:'solid', fgColor:{argb:'FFFCE4C8'}};
  const RED_FONT = {...FONT, color:{argb:'FFFF0000'}};

  const classShort = shortClassName(students[0]?.className);
  let semPart = "";
  const semStr = students[0]?.semester || "";
  const ym = semStr.match(/(\d{4}-\d{4})学年/);
  const sm = semStr.match(/第(\d)学期/);
  if (ym && sm) semPart = ym[1] + "学年第" + sm[1] + "学期";
  const title = classShort + semPart + nameLabels.join("/") + "成绩";

  const avgCol = 4 + mainCols.length;
  const trendCol = showTrend ? avgCol + 1 : null;
  const gpaCol = withGPA ? (showTrend ? avgCol + 2 : avgCol + 1) : null;
  const edgeCol = Math.max(avgCol, trendCol || 0, gpaCol || 0);
  const spacerColX = edgeCol + 1;

  const r1 = ws.addRow([title]);
  r1.height = 40;
  r1.getCell(1).font = {...FONT, bold:true, size:20};
  r1.getCell(1).alignment = {vertical:V, horizontal:"center"};
  ws.mergeCells(1, 1, 1, edgeCol);
  if (extraCols.length > 0) {
    const extStart = spacerColX + 1;
    const extEnd = spacerColX + extraCols.length;
    ws.mergeCells(1, extStart, 1, extEnd);
    const ec = ws.getRow(1).getCell(extStart);
    ec.value = "音体美";
    ec.font = {...FONT, bold:true, size:20};
    ec.alignment = {vertical:V, horizontal:"center"};
  }

  const headerData = ["序号", "姓名", "分数类别"];
  for (const col of mainCols) headerData.push(col);
  headerData.push("均分");
  if (showTrend) headerData.push("趋势");
  if (withGPA) headerData.push("GPA");
  headerData.push(""); // spacer
  for (const col of extraCols) headerData.push(col);

  const hRow = ws.addRow(headerData);
  hRow.height = 19;
  hRow.eachCell(c => { c.font = {...FONT, bold:true}; c.alignment = {vertical:V, horizontal:"center"}; if (c.value && String(c.value).trim()) c.fill = {type:'pattern', pattern:'solid', fgColor:{argb:'FFFFF9E0'}}; });

  const totalCols = spacerColX + extraCols.length;
  for (let c = 1; c <= totalCols; c++) ws.getColumn(c).width = DEFAULT_W;
  ws.getColumn(1).width = 6.5;

  const sortDef = paperSel.length ? paperSel[paperSel.length - 1] : sel[sel.length - 1];
  const sorted = [...students].sort((a, b) => {
    const aa = calcAvg(a, mainCols, sortDef.fn);
    const bb = calcAvg(b, mainCols, sortDef.fn);
    return (bb ?? -Infinity) - (aa ?? -Infinity);
  });

  for (let si = 0; si < sorted.length; si++) {
    const s = sorted[si];
    const rowNum = 3 + si * nRows;

    sel.forEach((d, di) => {
      const isPaper = d.key !== 'sem';
      const rowData = [di === 0 ? si + 1 : null, di === 0 ? s.cnName : null, d.type];
      for (const col of mainCols) {
        const c = s.courses[col];
        const v = c ? d.fn(c) : null;
        rowData.push(typeof v === "number" ? v : null);
      }
      rowData.push(calcAvg(s, mainCols, d.fn));
      if (showTrend) rowData.push(null);
      if (withGPA) rowData.push(null);
      rowData.push(null); // spacer
      for (const col of extraCols) {
        const c = s.courses[col];
        const v = c ? d.fn(c) : null;
        rowData.push(typeof v === "number" ? v : null);
      }
      const r = ws.addRow(rowData);
      r.height = 19;
      r.eachCell(c => { c.font = FONT; c.alignment = {vertical:V, horizontal:"center"}; });
      r.getCell(avgCol).numFmt = AVG_FMT;

      // 缺考橙色 / 低分红字（仅卷面行；缺考=非空非数值文本，null=该科无此次考试不标）
      if (isPaper) {
        const markCell = (cell, c, v) => {
          if (c && v != null && typeof v !== "number") cell.fill = ORANGE_FILL;
          else if (typeof v === "number" && v < 70) cell.font = RED_FONT;
        };
        for (let i = 0; i < mainCols.length; i++) {
          const c = s.courses[mainCols[i]];
          markCell(r.getCell(4 + i), c, c ? d.fn(c) : null);
        }
        for (let i = 0; i < extraCols.length; i++) {
          const c = s.courses[extraCols[i]];
          markCell(r.getCell(spacerColX + 1 + i), c, c ? d.fn(c) : null);
        }
      }

      // 三场及以上卷面：趋势逐行（本行相对上一场卷面）
      if (showTrend && perRowTrend && isPaper) {
        const p = paperSel.indexOf(d);
        if (p > 0) {
          const a = calcAvg(s, mainCols, paperSel[p - 1].fn);
          const b = calcAvg(s, mainCols, d.fn);
          const t = (a !== null && b !== null) ? Math.round((b - a) * 10) / 10 : null;
          const tc = r.getCell(trendCol);
          tc.value = t; tc.numFmt = '0.0';
          tc.font = FONT;
          tc.alignment = {vertical:V, horizontal:"center"};
          if (t !== null) tc.fill = t >= 0 ? GREEN_FILL : RED_FILL;
        }
      }
    });

    // 合并：序号/姓名（多行时）
    if (nRows > 1) {
      ws.mergeCells(rowNum, 1, rowNum + nRows - 1, 1);
      ws.mergeCells(rowNum, 2, rowNum + nRows - 1, 2);
    }
    // 两场卷面：趋势合并单元格（沿用旧版样式）
    if (showTrend && !perRowTrend) {
      const a = calcAvg(s, mainCols, paperSel[0].fn);
      const b = calcAvg(s, mainCols, paperSel[1].fn);
      const trend = (a !== null && b !== null) ? Math.round((b - a) * 10) / 10 : null;
      if (nRows > 1) ws.mergeCells(rowNum, trendCol, rowNum + nRows - 1, trendCol);
      const tc = ws.getRow(rowNum).getCell(trendCol);
      tc.value = trend; tc.numFmt = '0.0'; tc.font = FONT;
      tc.alignment = {vertical:V, horizontal:"center"};
      if (trend !== null) tc.fill = trend >= 0 ? GREEN_FILL : RED_FILL;
    }
    if (withGPA) {
      if (nRows > 1) ws.mergeCells(rowNum, gpaCol, rowNum + nRows - 1, gpaCol);
      const gc = ws.getRow(rowNum).getCell(gpaCol);
      gc.value = calcStudentGPA(s); gc.numFmt = '0.00'; gc.font = FONT;
      gc.alignment = {vertical:V, horizontal:"center"};
    }
  }

  const lastRow = 2 + sorted.length * nRows;
  const allBorder = {top:{style:"thin"},bottom:{style:"thin"},left:{style:"thin"},right:{style:"thin"}};
  for (let r = 1; r <= lastRow; r++) {
    const row = ws.getRow(r);
    for (let c = 1; c <= spacerColX + extraCols.length; c++) {
      if (c === spacerColX) continue;
      row.getCell(c).border = allBorder;
    }
  }

  addUnifiedStats(ws, sorted, mainCols, extraCols, avgCol, spacerColX, sel, FONT);

  const buf = await wb.xlsx.writeBuffer();
  const blob = new Blob([buf], {type:"application/octet-stream"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = (classShort || "") + nameLabels.join("") + "成绩.xlsx";
  a.click();
  URL.revokeObjectURL(a.href);
}

// N场考试通用统计区：每个指标 × 每个勾选项一行（与页面预览口径一致）
function addUnifiedStats(ws, students, mainCols, extraCols, avgCol, spacerCol, sel, FONT) {
  const V = "middle";
  const YELLOW_FILL = {type:'pattern',pattern:'solid',fgColor:{argb:'FFFFF9E0'}};
  const allBorder = {top:{style:"thin"},bottom:{style:"thin"},left:{style:"thin"},right:{style:"thin"}};
  const allCols = [...mainCols, ...extraCols];

  for (let i = 0; i < 4; i++) ws.addRow([]);

  const hdrRow = new Array(spacerCol + extraCols.length).fill(null);
  for (let i = 0; i < mainCols.length; i++) hdrRow[3 + i] = mainCols[i];
  hdrRow[avgCol - 1] = "平均";
  for (let i = 0; i < extraCols.length; i++) hdrRow[spacerCol + i] = extraCols[i];
  const hr = ws.addRow(hdrRow);
  hr.height = 19;
  hr.eachCell(c => { c.font = {...FONT, bold:true}; c.alignment = {vertical:V, horizontal:"center"}; if (c.value && String(c.value).trim()) c.fill = YELLOW_FILL; });
  for (let c = 3; c <= avgCol; c++) hr.getCell(c).border = allBorder;
  for (let i = 0; i < extraCols.length; i++) hr.getCell(spacerCol + 1 + i).border = allBorder;

  const statsPerExam = sel.map(d => {
    const result = {};
    for (const col of allCols) result[col] = subjectStats(students, col, d.fn);
    return result;
  });

  function addStatRow(label, metricFn, fmt) {
    const rowData = new Array(spacerCol + extraCols.length).fill(null);
    rowData[2] = label;
    const mainVals = [];
    for (let i = 0; i < mainCols.length; i++) {
      const v = metricFn(mainCols[i]);
      rowData[3 + i] = v;
      if (typeof v === "number") mainVals.push(v);
    }
    if (mainVals.length > 0) rowData[avgCol - 1] = Math.round(mainVals.reduce((a,b)=>a+b,0) / mainVals.length * 100) / 100;
    for (let i = 0; i < extraCols.length; i++) rowData[spacerCol + i] = metricFn(extraCols[i]);
    const r = ws.addRow(rowData);
    r.height = 19;
    r.eachCell(c => { c.font = FONT; c.alignment = {vertical:V, horizontal:"center"}; });
    r.getCell(3).font = {...FONT, bold:true};
    for (let i = 0; i < mainCols.length; i++) r.getCell(4 + i).numFmt = fmt;
    r.getCell(avgCol).numFmt = fmt;
    for (let i = 0; i < extraCols.length; i++) r.getCell(spacerCol + 1 + i).numFmt = fmt;
    for (let c = 3; c <= avgCol; c++) r.getCell(c).border = allBorder;
    for (let i = 0; i < extraCols.length; i++) r.getCell(spacerCol + 1 + i).border = allBorder;
    return r;
  }

  // 学科趋势行：相邻两场卷面之间。均分=相对变化百分比，及格率/优秀率=百分点差值。
  const PURPLE_FILL = {type:'pattern',pattern:'solid',fgColor:{argb:'FFF2C7FF'}};
  const STAT_GREEN = {type:'pattern',pattern:'solid',fgColor:{argb:'FF92D050'}};
  const STAT_RED = {type:'pattern',pattern:'solid',fgColor:{argb:'FFFFC9C7'}};
  const paperSel2 = sel.filter(d => d.key !== 'sem');
  const paperPairs = [];
  for (let i = 1; i < paperSel2.length; i++) paperPairs.push([sel.indexOf(paperSel2[i - 1]), sel.indexOf(paperSel2[i])]);
  const trendOf = (m, i, j, col) => {
    const a = statsPerExam[i][col]?.[m], b = statsPerExam[j][col]?.[m];
    if (typeof a !== "number" || typeof b !== "number") return null;
    if (m === "avg") return a !== 0 ? Math.round((b - a) / a * 100) / 100 : null;
    return Math.round((b - a) * 100) / 100;
  };
  function paintTrendRow(r) {
    r.getCell(3).fill = PURPLE_FILL;
    const paint = cell => { if (typeof cell.value === "number") cell.fill = cell.value >= 0 ? STAT_GREEN : STAT_RED; };
    for (let i = 0; i < mainCols.length; i++) paint(r.getCell(4 + i));
    paint(r.getCell(avgCol));
    for (let i = 0; i < extraCols.length; i++) paint(r.getCell(spacerCol + 1 + i));
  }

  const groups = [
    { name: "均分",   metric: "avg",   fmt: '0' },
    { name: "及格率", metric: "pass",  fmt: '0%' },
    { name: "优秀率", metric: "excel", fmt: '0%' },
  ];
  for (const g of groups) {
    sel.forEach((d, di) => {
      addStatRow(d.label + g.name, col => statsPerExam[di][col]?.[g.metric] ?? null, g.fmt);
    });
    for (const [i, j] of paperPairs) {
      const label = paperPairs.length > 1 ? `趋势 ${sel[i].label}→${sel[j].label}` : "趋势";
      const r = addStatRow(label, col => trendOf(g.metric, i, j, col), '0%');
      // 平均列：全科口径同一公式覆盖
      const avgAll = idx => {
        const vs = mainCols.map(c => statsPerExam[idx][c]?.[g.metric]).filter(v => typeof v === "number");
        return vs.length ? vs.reduce((a,b)=>a+b,0) / vs.length : null;
      };
      const aAll = avgAll(i), bAll = avgAll(j);
      let tAll = null;
      if (aAll !== null && bAll !== null) tAll = g.metric === "avg" ? (aAll !== 0 ? Math.round((bAll - aAll) / aAll * 100) / 100 : null) : Math.round((bAll - aAll) * 100) / 100;
      const ac = r.getCell(avgCol);
      ac.value = tAll; ac.numFmt = '0%';
      ac.font = FONT;
      ac.alignment = {vertical:"middle", horizontal:"center"};
      paintTrendRow(r);
    }
  }
}

    getScores: c => sel.map(d => d.fn(c)),
    getExtraScores: c => sel.map(d => d.fn(c)),
    getAvgs: (s, mc) => sel.map(d => calcAvg(s, mc, d.fn)),
    lightCol: lightIdxs.length ? lightIdxs : null,
    highlightCol: hiIdx,
    getTrend: paperSel.length >= 2 ? ((s, mc) => {
      const a = calcAvg(s, mc, paperSel[paperSel.length - 2].fn);
      const b = calcAvg(s, mc, paperSel[paperSel.length - 1].fn);
      return (a !== null && b !== null) ? Math.round((b - a) * 10) / 10 : null;
    }) : (() => null),
    sortFn: (s, mc) => calcAvg(s, mc, sortDef.fn),
  }, withGPA);
  const buf = await wb.xlsx.writeBuffer();
  const blob = new Blob([buf], {type:"application/octet-stream"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = nameLabels.join("") + "学生成绩条.xlsx";
  a.click();
  URL.revokeObjectURL(a.href);
}

// ===== Makeup exam list functions =====

// Makeup exam subject grouping: maps courseScores key -> broader category
const MAKEUP_GROUP = {
  "AP预备微积分":"数学","AP微积分":"数学","AP统计":"数学","数学":"数学","预备微积分":"数学","代数2":"数学","3U数学":"数学",
  "AP物理1":"物理","AP物理2":"物理","AP物理C":"物理","物理":"物理",
  "AP化学":"化学","化学":"化学",
  "生物一册":"生物","生物二册":"生物","AP生物":"生物","生物":"生物",
  "语文一册":"语文","语文二册":"语文",
  "计算机":"经济学/AP计算机","AP计算机科学":"经济学/AP计算机","AP微观经济":"经济学/AP计算机","AP宏观经济":"经济学/AP计算机","AP宏观经济学":"经济学/AP计算机","经济学":"经济学/AP计算机",
};
const MAKEUP_ORDER = [
  "听说","读写","托福课程","文书写作","英美文学","文学",
  "数学","物理","化学","生物","语文",
  "经济学/AP计算机",
  "美国历史","世界历史","中国历史","AP心理学","AP研讨会","知识论TOK",
  "美术","戏剧","小语种","音乐","体育",
];

function buildMakeupData(students, scoreFn) {
  // Group: subject category -> class name -> [{name, score, absent}]
  // 纳入规则：卷面分数 < 70，或缺考（成绩为 "Absent" 等非数值文本）。
  // score 为 null 表示该科目本次没有安排考试（导出中无此列），不纳入。
  const groups = {};
  for (const s of students) {
    for (const key of Object.keys(s.courses)) {
      const c = s.courses[key];
      const score = scoreFn(c);
      const isNum = typeof score === "number";
      const isAbsent = !isNum && score !== null && score !== undefined;
      if ((isNum && score < 70) || isAbsent) {
        const subject = MAKEUP_GROUP[key] || key;
        const cls = c.courseClassName || c.courseCN || key;
        if (!groups[subject]) groups[subject] = {};
        if (!groups[subject][cls]) groups[subject][cls] = [];
        groups[subject][cls].push({name: s.cnName, score: isAbsent ? "缺考" : score, absent: isAbsent});
      }
    }
  }
  return groups;
}

// 补考名单排序：缺考排最前，其余按分数升序
const makeupSortCmp = (a, b) => {
  if (!!a.absent !== !!b.absent) return a.absent ? -1 : 1;
  if (a.absent && b.absent) return 0;
  return a.score - b.score;
};

async function dlMakeup(students, mainCols, extraCols, examType) {

  const scoreFn = isMid ? (c => c.midScore) : (c => c.finalScore);
  const groups = buildMakeupData(students, scoreFn);
  
  if (Object.keys(groups).length === 0) {
    alert(isMid ? "没有期中考试低于70分或缺考的学生" : "没有期末考试低于70分或缺考的学生");
    return;
  }

  const wb = new ExcelJS.Workbook();
  const ws = wb.addWorksheet("建议补考名单");
  ws.views = [{showGridLines: false}];
  const FONT = {name:"Arial", size:11};
  const V = "middle";
  const BLUE_FILL = {type:'pattern', pattern:'solid', fgColor:{argb:'FFDCE6F1'}};
  const allBorder = {top:{style:"thin"},bottom:{style:"thin"},left:{style:"thin"},right:{style:"thin"}};

  const classShort = shortClassName(students[0]?.className);
  let semPart = "";
  const semStr = students[0]?.semester || "";
  const ym = semStr.match(/(\d{4}-\d{4})学年/);
  const sm = semStr.match(/第(\d)学期/);
  if (ym && sm) semPart = ym[1] + "学年第" + sm[1] + "学期";

  const examLabel = isMid ? "期中" : "期末";
  const titleText = semPart + " " + classShort + " " + examLabel + "建议补考学生名单";
  const r1 = ws.addRow([""]);
  r1.height = 60;
  r1.getCell(1).value = {richText: [
    {font: {name:"Arial", size:17, bold:true}, text: titleText + "\n"},
    {font: {name:"Arial", size:12, color:{argb:'FF666666'}}, text: "卷面成绩低于70分或缺考自动加入建议补考名单"}
  ]};
  r1.getCell(1).alignment = {vertical:V, horizontal:"center", wrapText:true};

  const hRow = ws.addRow(["科目", "班级", "建议补考学生名单"]);
  hRow.height = 35;
  hRow.eachCell(c => { c.font = {...FONT, bold:true, size:12}; c.alignment = {vertical:V, horizontal:"center"}; c.fill = BLUE_FILL; c.border = allBorder; });

  ws.getColumn(1).width = 14;
  ws.getColumn(2).width = 30;

  // Determine subject ordering for makeup list
  const MAKEUP_ORDER = [
    "听说","读写","托福课程","文书写作","英美文学",
    "文学","数学",
    "物理","生物","化学",
    "语文",
    "经济学/AP计算机","AP心理学","AP研讨会",
    "美国历史","世界历史","中国历史",
    "小语种","美术","戏剧","音乐","体育",
    "计算机","知识论TOK","Capstone",
  ];
  const orderedSubjects = Object.keys(groups).sort((a, b) => {
    const ia = MAKEUP_ORDER.indexOf(a);
    const ib = MAKEUP_ORDER.indexOf(b);
    return (ia === -1 ? 999 : ia) - (ib === -1 ? 999 : ib);
  });

  let maxStudents = 0;
  for (const subj of orderedSubjects) {
    for (const cls of Object.keys(groups[subj])) {
      maxStudents = Math.max(maxStudents, groups[subj][cls].length);
    }
  }
  for (let c = 3; c <= 2 + maxStudents; c++) ws.getColumn(c).width = 12;
  if (maxStudents > 1) {
    ws.mergeCells(2, 3, 2, 2 + maxStudents);
  }

  // Helper: strip semester prefix from class names
  function cleanClassName(cls) {
    // Remove patterns like "25秋 ", "25春 ", "金盏26春", "25 金盏..."
    return cls.replace(/^(?:\d{2,4}\s*)?(?:金盏|北外)?\d{0,4}[秋春]\s*/,"").replace(/^\d{2,4}\s+/,"").trim();
  }

  const RED_FONT_M = {...FONT, size:10, color:{argb:'FF999999'}};

  for (const subj of orderedSubjects) {
    const classes = Object.keys(groups[subj]).sort();
    const groupStartRow = ws.rowCount + 1;
    for (const cls of classes) {
      const entries = groups[subj][cls].sort(makeupSortCmp);
      // Name row
      const nameRow = ["", cleanClassName(cls), ...entries.map(e => e.name)];
      const nr = ws.addRow(nameRow);
      nr.height = 30;
      nr.eachCell(c => { c.font = FONT; c.alignment = {vertical:V, horizontal:"center"}; });
      // Score row
      const scoreRow = ["", "", ...entries.map(e => e.score)];
      const sr = ws.addRow(scoreRow);
      sr.height = 16;
      sr.eachCell(c => { c.font = RED_FONT_M; c.alignment = {vertical:V, horizontal:"center"}; });
      entries.forEach((e, i) => { if (e.absent) sr.getCell(3 + i).font = {...FONT, size:10, bold:true, color:{argb:'FFC07F28'}}; });
      // Merge 班级 cell across two rows
      const nrNum = nr.number;
      ws.mergeCells(nrNum, 2, nrNum + 1, 2);
      ws.getRow(nrNum).getCell(2).alignment = {vertical:V, indent:1};
    }
    const groupEndRow = ws.rowCount;
    if (groupEndRow >= groupStartRow) {
      if (groupEndRow > groupStartRow) {
        ws.mergeCells(groupStartRow, 1, groupEndRow, 1);
      }
      const subjCell = ws.getRow(groupStartRow).getCell(1);
      subjCell.value = subj;
      subjCell.font = {...FONT, bold:true};
      subjCell.alignment = {vertical:V, horizontal:"center"};
    }
  }

  // Full grid borders: from header row (2) to last data row, columns 1 to (2 + maxStudents)
  const lastDataRow = ws.rowCount;
  const lastCol = 2 + maxStudents;
  for (let r = 2; r <= lastDataRow; r++) {
    const row = ws.getRow(r);
    for (let c = 1; c <= lastCol; c++) {
      row.getCell(c).border = allBorder;
    }
  }

  // Merge title row
  ws.mergeCells(1, 1, 1, Math.max(3, lastCol));

  // === Sheet 2: By student ===
  const ws2 = wb.addWorksheet("各学生建议补考科目");
  ws2.views = [{showGridLines: false}];

  const title2Text = semPart + " " + classShort + " " + examLabel + "各学生建议补考科目";
  const r1s2 = ws2.addRow([""]);
  r1s2.height = 60;
  r1s2.getCell(1).value = {richText: [
    {font: {name:"Arial", size:17, bold:true}, text: title2Text + "\n"},
    {font: {name:"Arial", size:12, color:{argb:'FF666666'}}, text: "卷面成绩低于70分或缺考自动加入建议补考名单"}
  ]};
  r1s2.getCell(1).alignment = {vertical:V, horizontal:"center", wrapText:true};

  const hRow2 = ws2.addRow(["姓名", "建议补考科目", "班级", "卷面分数"]);
  hRow2.height = 35;
  hRow2.eachCell(c => { c.font = {...FONT, bold:true, size:12}; c.alignment = {vertical:V, horizontal:"center"}; c.fill = BLUE_FILL; c.border = allBorder; });

  ws2.getColumn(1).width = 14;
  ws2.getColumn(2).width = 18;
  ws2.getColumn(3).width = 28;
  ws2.getColumn(4).width = 14;

  // Collect all entries grouped by student
  const byStudent = {};
  for (const subj of orderedSubjects) {
    for (const cls of Object.keys(groups[subj])) {
      for (const e of groups[subj][cls]) {
        if (!byStudent[e.name]) byStudent[e.name] = [];
        byStudent[e.name].push({subject: subj, cls: cleanClassName(cls), score: e.score, absent: e.absent});
      }
    }
  }

  // Sort students by name, within each student sort by score ascending
  const studentNames = Object.keys(byStudent).sort((a, b) => a.localeCompare(b, 'zh'));

  for (const name of studentNames) {
    const items = byStudent[name].sort(makeupSortCmp);
    const groupStart = ws2.rowCount + 1;
    for (let i = 0; i < items.length; i++) {
      const it = items[i];
      const rowData = ["", it.subject, it.cls, it.score];
      const r = ws2.addRow(rowData);
      r.height = 25;
      r.eachCell(c => { c.font = FONT; c.alignment = {vertical:V, horizontal:"center"}; });
      r.getCell(4).font = it.absent ? {...FONT, bold:true, color:{argb:'FFC07F28'}} : RED_FONT_M;
    }
    const groupEnd = ws2.rowCount;
    if (groupEnd > groupStart) {
      ws2.mergeCells(groupStart, 1, groupEnd, 1);
    }
    const nameCell = ws2.getRow(groupStart).getCell(1);
    nameCell.value = name;
    nameCell.font = {...FONT, bold:true};
    nameCell.alignment = {vertical:V, horizontal:"center"};
  }

  // Full grid borders for sheet 2
  const lastDataRow2 = ws2.rowCount;
  for (let r = 2; r <= lastDataRow2; r++) {
    const row = ws2.getRow(r);
    for (let c = 1; c <= 4; c++) {
      row.getCell(c).border = allBorder;
    }
  }

  // Merge title row
  ws2.mergeCells(1, 1, 1, 4);

  const buf = await wb.xlsx.writeBuffer();
  const blob = new Blob([buf], {type:"application/octet-stream"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = examLabel + "补考学生名单.xlsx";
  a.click();
  URL.revokeObjectURL(a.href);
}

async function dlHomework(students) {
  const FONT = {name:"Arial", size:10};
  const V = "middle";
  const YELLOW_FILL = {type:'pattern',pattern:'solid',fgColor:{argb:'FFFFF9E0'}};
  const RED_FILL = {type:'pattern',pattern:'solid',fgColor:{argb:'FFFFC9C7'}};
  const allBorder = {top:{style:"thin"},bottom:{style:"thin"},left:{style:"thin"},right:{style:"thin"}};

  const wb = new ExcelJS.Workbook();
  const ws = wb.addWorksheet("问题作业");
  ws.views = [{showGridLines: false}];

  // Title
  const title = (students[0]?.className || "") + " 班级问题作业清单";
  const r1 = ws.addRow([""]);
  ws.mergeCells(1, 1, 1, 6);
  r1.height = 60;
  r1.getCell(1).value = {richText: [
    {font: {name:"Arial", size:20, bold:true}, text: title + "\n"},
    {font: {name:"Arial", size:12, color:{argb:'FF666666'}}, text: "作业分数低于50自动列为问题作业"}
  ]};
  r1.getCell(1).alignment = {vertical:V, horizontal:"center", wrapText:true};

  // Header
  const hr = ws.addRow(["序号","姓名","科目","任课老师","作业名称","得分"]);
  hr.height = 24;
  hr.eachCell(c => {
    c.font = {...FONT, bold:true};
    c.alignment = {vertical:V, horizontal:"center"};
    c.fill = YELLOW_FILL;
    c.border = allBorder;
  });

  // Collect all problem homework, sorted by problem count descending
  const hwStudents = students.filter(s => s.hwProblems && s.hwProblems.length > 0)
    .sort((a, b) => b.hwProblems.length - a.hwProblems.length);
  let seq = 0;
  for (const s of hwStudents) {
    seq++;
    // Sort by course so same courses are adjacent
    const sorted = [...s.hwProblems].sort((a, b) => a.displayName < b.displayName ? -1 : a.displayName > b.displayName ? 1 : 0);
    const startRow = ws.rowCount + 1;
    for (let i = 0; i < sorted.length; i++) {
      const hw = sorted[i];
      const row = ws.addRow([
        i === 0 ? seq : "",
        i === 0 ? s.cnName : "",
        hw.displayName,
        hw.teacher,
        hw.hwName,
        hw.score
      ]);
      row.height = 24;
      row.eachCell((c, ci) => {
        c.font = FONT;
        c.alignment = {vertical:V, horizontal:"center"};
        c.border = allBorder;
      });
      row.getCell(6).fill = RED_FILL;
      row.getCell(6).font = {...FONT, color:{argb:"FFCC0000"}};
    }
    const endRow = ws.rowCount;
    // Merge 序号 and 姓名
    if (sorted.length > 1) {
      ws.mergeCells(startRow, 1, endRow, 1);
      ws.mergeCells(startRow, 2, endRow, 2);
    }
    // Merge 科目 and 任课老师 columns for consecutive same-course rows
    let cStart = startRow;
    for (let r = startRow + 1; r <= endRow + 1; r++) {
      const prev = r <= endRow ? ws.getCell(r, 3).value : null;
      const cur = ws.getCell(cStart, 3).value;
      if (r <= endRow && prev === cur) continue;
      if (r - 1 > cStart) {
        ws.mergeCells(cStart, 3, r - 1, 3);
        ws.mergeCells(cStart, 4, r - 1, 4);
      }
      cStart = r;
    }
  }

  // Column widths
  ws.getColumn(1).width = 6.5;
  ws.getColumn(2).width = 12;
  ws.getColumn(3).width = 14;
  ws.getColumn(4).width = 12;
  ws.getColumn(5).width = 45;
  ws.getColumn(6).width = 8;

  const buf = await wb.xlsx.writeBuffer();
  const blob = new Blob([buf], {type:"application/octet-stream"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "班级问题作业清单.xlsx";
  a.click();
  URL.revokeObjectURL(a.href);
}

  const sorted = [...students].sort((a, b) => {
    const aa = calcAvg(a, mainCols, scoreFn);

    }
    h += `<td class="cell-avg">${testAvg !== null ? testAvg.toFixed(1) : ''}</td>`;
    if (withGPA) {

  // Stats cards
  const stats = {};
  for (const col of allCols) {

  // Overall averages
  const avgVals = mainCols.map(c => stats[c]?.avg).filter(v => typeof v === "number");

  }

  h += `</div>`;

  h += `</div>`;

function previewCompare(students, mainCols, extraCols, mode, withGPA, noSem) {
  history.pushState({view:'preview'}, '');
  const res = document.getElementById("results");
  const allCols = [...mainCols, ...extraCols];

  // Config per mode
  const cfg = mode === 'mid' ? {
    title: '月考/期中成绩对比',
    row1: {label:'月考卷面', fn: c => c.testScore},
    row2: {label:'期中卷面', fn: c => c.midScore},
    sortFn: c => c.midScore,
    trendLabel: '趋势',
    dlFn: 'dlCompare',
  } : {
    title: '期中/期末成绩对比',
    row1: {label:'期中卷面', fn: c => c.midScore},
    row2: {label:'期末卷面', fn: c => c.finalScore},
    sortFn: c => c.finalScore,
    trendLabel: '趋势',
    dlFn: 'dlMidFinal',
  };

  const sorted = [...students].sort((a, b) => {
    const aa = calcAvg(a, mainCols, cfg.sortFn);
    const bb = calcAvg(b, mainCols, cfg.sortFn);
    return (bb ?? -Infinity) - (aa ?? -Infinity);
  });

  const classShort = shortClassName(students[0]?.className);

  let h = `<div class="preview-bar">`;
  h += `<div class="preview-title">${classShort} ${cfg.title}${noSem ? '（不含综合成绩）' : ''}</div>`;
  h += `<div class="preview-actions">`;
  h += `<button class="btn-back" onclick="render(outputData.students, outputData.mainCols, outputData.extraCols)">← 返回</button>`;
  h += `<button class="btn-dl" onclick="${cfg.dlFn}(outputData.students, outputData.mainCols, outputData.extraCols, ${!!withGPA}, ${!!noSem})">下载 Excel</button>`;
  h += `</div></div>`;

  // Table
  h += `<div class="preview-table-wrap"><table class="preview-table">`;
  h += `<thead><tr><th class="sticky-col sticky-seq" style="width:40px">#</th><th class="sticky-col sticky-name" style="min-width:70px;text-align:left;padding-left:14px">姓名</th><th class="sticky-col sticky-type" style="width:60px">类别</th>`;
  for (const col of mainCols) h += `<th>${DISPLAY_MAP[col] || col}</th>`;
  h += `<th style="background:#dceef8;color:#1a9be0">均分</th>`;
  h += `<th style="background:#e8f5e8;color:#3e7a60">趋势</th>`;
  if (withGPA) h += `<th style="background:#e8f5e8;color:#3e7a60">GPA</th>`;
  if (extraCols.length) { for (const col of extraCols) h += `<th>${DISPLAY_MAP[col] || col}</th>`; }
  h += `</tr></thead><tbody>`;

  for (let si = 0; si < sorted.length; si++) {
    const s = sorted[si];
    const avg1 = calcAvg(s, mainCols, cfg.row1.fn);
    const avg2 = calcAvg(s, mainCols, cfg.row2.fn);
    const semAvg = noSem ? null : calcAvg(s, mainCols, c => c.semScore);
    const trend = (avg2 !== null && avg1 !== null) ? Math.round((avg2 - avg1) * 10) / 10 : null;
    const rspan = noSem ? ' rowspan="2"' : ' rowspan="3"';

    function scoreCell(col, scoreFn, isHighlight, isLight, showAbsent) {
      const c = s.courses[col];
      const v = c ? scoreFn(c) : null;
      if (c && typeof v !== "number") {
        if (showAbsent) return `<td style="color:#b0b8c4;font-size:11px">缺考</td>`;
        return `<td class="cell-orange"></td>`;
      }
      const lightStyle = isLight ? ' style="color:#b0b8c4"' : '';
      if (v !== null && v !== undefined) return `<td${isHighlight && v < 70 ? ' class="cell-red"' : lightStyle}>${v}</td>`;
      return `<td></td>`;
    }

    // Row 1
    h += `<tr class="row-test student-first">`;
    h += `<td class="cell-seq sticky-col sticky-seq"${rspan}>${si + 1}</td>`;
    h += `<td class="cell-name sticky-col sticky-name"${rspan}>${s.cnName}</td>`;
    h += `<td class="cell-type sticky-col sticky-type">${cfg.row1.label}</td>`;
    for (const col of mainCols) h += scoreCell(col, cfg.row1.fn, false, true, true);
    h += `<td class="cell-avg" style="color:#b0b8c4">${avg1 !== null ? avg1.toFixed(1) : ''}</td>`;
    h += `<td${rspan} style="font-weight:500;${trend !== null ? (trend >= 0 ? 'color:#3e7a60;background:#f0f8f2' : 'color:#c4554d;background:#fdf4f3') : ''}">${trend !== null ? (trend >= 0 ? '+' : '') + trend.toFixed(1) : ''}</td>`;
    if (withGPA) {
      const gpa = calcStudentGPA(s);
      h += `<td${rspan} style="font-weight:500;color:#3e7a60">${gpa !== null ? gpa.toFixed(2) : ''}</td>`;
    }
    if (extraCols.length) { for (const col of extraCols) h += scoreCell(col, cfg.row1.fn, false, true, true); }
    h += `</tr>`;

    // Row 2
    h += `<tr class="row-sem">`;
    h += `<td class="cell-type sticky-col sticky-type">${cfg.row2.label}</td>`;
    for (const col of mainCols) h += scoreCell(col, cfg.row2.fn, true, false, false);
    h += `<td class="cell-avg">${avg2 !== null ? avg2.toFixed(1) : ''}</td>`;
    if (extraCols.length) { for (const col of extraCols) h += scoreCell(col, cfg.row2.fn, true, false, false); }
    h += `</tr>`;

    // Row 3: 综合成绩 (skip if noSem)
    if (!noSem) {
    h += `<tr class="row-sem">`;
    h += `<td class="cell-type sticky-col sticky-type">综合成绩</td>`;
    for (const col of mainCols) {
      const c = s.courses[col];
      const v = c ? c.semScore : null;
      h += `<td>${v !== null && v !== undefined ? v : ''}</td>`;
    }
    h += `<td class="cell-avg">${semAvg !== null ? semAvg.toFixed(1) : ''}</td>`;
    if (extraCols.length) {
      for (const col of extraCols) {
        const c = s.courses[col];
        const v = c ? c.semScore : null;
        h += `<td>${v !== null && v !== undefined ? v : ''}</td>`;
      }
    }
    h += `</tr>`;
    }
  }
  h += `</tbody></table></div>`;

  // Stats cards - compute for both exams to show trends
  const stats1 = {}, stats2 = {};
  for (const col of allCols) {
    stats1[col] = subjectStats(sorted, col, cfg.row1.fn);
    stats2[col] = subjectStats(sorted, col, cfg.row2.fn);
  }
  const avgVals2 = mainCols.map(c => stats2[c]?.avg).filter(v => typeof v === "number");
  const passVals2 = mainCols.map(c => stats2[c]?.pass).filter(v => typeof v === "number");
  const excelVals2 = mainCols.map(c => stats2[c]?.excel).filter(v => typeof v === "number");
  const overallAvg = avgVals2.length ? Math.round(avgVals2.reduce((a,b)=>a+b,0) / avgVals2.length) : null;
  const overallPass = passVals2.length ? Math.round(passVals2.reduce((a,b)=>a+b,0) / passVals2.length * 100) : null;
  const overallExcel = excelVals2.length ? Math.round(excelVals2.reduce((a,b)=>a+b,0) / excelVals2.length * 100) : null;
  const avgVals1 = mainCols.map(c => stats1[c]?.avg).filter(v => typeof v === "number");
  const passVals1 = mainCols.map(c => stats1[c]?.pass).filter(v => typeof v === "number");
  const excelVals1 = mainCols.map(c => stats1[c]?.excel).filter(v => typeof v === "number");
  const overallAvg1 = avgVals1.length ? Math.round(avgVals1.reduce((a,b)=>a+b,0) / avgVals1.length) : null;
  const overallPass1 = passVals1.length ? Math.round(passVals1.reduce((a,b)=>a+b,0) / passVals1.length * 100) : null;
  const overallExcel1 = excelVals1.length ? Math.round(excelVals1.reduce((a,b)=>a+b,0) / excelVals1.length * 100) : null;
  const examLabel = cfg.row2.label.replace('卷面','');

  function trendHtml(newV, oldV, isPct) {
    if (newV === null || oldV === null || newV === undefined || oldV === undefined) return '<span class="stat-trend"></span>';
    if (oldV === 0) return '<span class="stat-trend"></span>';
    let diff;
    if (isPct) {
      diff = Math.round((newV - oldV) / oldV * 100);
    } else {
      diff = Math.round((newV - oldV) / oldV * 100);
    }
    const sign = diff >= 0 ? '+' : '';
    const color = diff >= 0 ? '#3e7a60' : '#c4554d';
    return `<span class="stat-trend" style="color:${color}">${sign}${diff}%</span>`;
  }

  h += `<div class="stats-cards">`;

  h += `<div class="stat-card"><div class="stat-card-title"><span class="stat-dot" style="background:#1a9be0"></span>${examLabel}各科均分</div>`;
  h += `<div class="stat-header"><span></span><span>均分</span><span>趋势</span></div>`;
  for (const col of mainCols) { const v = stats2[col]?.avg; const o = stats1[col]?.avg; h += `<div class="stat-row"><span class="stat-label">${col}</span><span class="stat-value">${v !== null ? v : '-'}</span>${trendHtml(v, o, false)}</div>`; }
  h += `<div style="border-top:2px solid #e2e8ed;margin-top:-1px;padding-top:8px"><div class="stat-row" style="border-bottom:none"><span class="stat-label" style="font-weight:500">全科平均</span><span class="stat-value" style="color:#1a9be0">${overallAvg !== null ? overallAvg : '-'}</span>${trendHtml(overallAvg, overallAvg1, false)}</div></div></div>`;

  h += `<div class="stat-card"><div class="stat-card-title"><span class="stat-dot" style="background:#3e7a60"></span>${examLabel}各科及格率</div>`;
  h += `<div class="stat-header"><span></span><span>及格率</span><span>趋势</span></div>`;
  for (const col of mainCols) { const v = stats2[col]?.pass; const o = stats1[col]?.pass; h += `<div class="stat-row"><span class="stat-label">${col}</span><span class="stat-value">${v !== null ? Math.round(v*100)+'%' : '-'}</span>${trendHtml(v, o, true)}</div>`; }
  h += `<div style="border-top:2px solid #e2e8ed;margin-top:-1px;padding-top:8px"><div class="stat-row" style="border-bottom:none"><span class="stat-label" style="font-weight:500">全科平均</span><span class="stat-value" style="color:#3e7a60">${overallPass !== null ? overallPass+'%' : '-'}</span>${(overallPass !== null && overallPass1 !== null && overallPass1 !== 0) ? (() => { const d = Math.round((overallPass - overallPass1) / overallPass1 * 100); const s = d >= 0 ? '+' : ''; const c = d >= 0 ? '#3e7a60' : '#c4554d'; return '<span class="stat-trend" style="color:'+c+'">'+s+d+'%</span>'; })() : '<span class="stat-trend"></span>'}</div></div></div>`;

  h += `<div class="stat-card"><div class="stat-card-title"><span class="stat-dot" style="background:#cb8a2e"></span>${examLabel}各科优秀率</div>`;
  h += `<div class="stat-header"><span></span><span>优秀率</span><span>趋势</span></div>`;
  for (const col of mainCols) { const v = stats2[col]?.excel; const o = stats1[col]?.excel; h += `<div class="stat-row"><span class="stat-label">${col}</span><span class="stat-value">${v !== null ? Math.round(v*100)+'%' : '-'}</span>${trendHtml(v, o, true)}</div>`; }
  h += `<div style="border-top:2px solid #e2e8ed;margin-top:-1px;padding-top:8px"><div class="stat-row" style="border-bottom:none"><span class="stat-label" style="font-weight:500">全科平均</span><span class="stat-value" style="color:#cb8a2e">${overallExcel !== null ? overallExcel+'%' : '-'}</span>${(overallExcel !== null && overallExcel1 !== null && overallExcel1 !== 0) ? (() => { const d = Math.round((overallExcel - overallExcel1) / overallExcel1 * 100); const s = d >= 0 ? '+' : ''; const c = d >= 0 ? '#3e7a60' : '#c4554d'; return '<span class="stat-trend" style="color:'+c+'">'+s+d+'%</span>'; })() : '<span class="stat-trend"></span>'}</div></div></div>`;
  h += `</div>`;

  res.innerHTML = h;
  window.scrollTo({top: document.querySelector('.wrap').offsetTop, behavior: 'smooth'});
  document.querySelector('.wrap').classList.add('preview-mode');
}

function previewMakeup(students, mainCols, extraCols, examType) {
  history.pushState({view:'preview'}, '');
  const res = document.getElementById("results");
  const isMid = examType === "mid";
  const scoreFn = isMid ? (c => c.midScore) : (c => c.finalScore);
  const groups = buildMakeupData(students, scoreFn);
  const examLabel = isMid ? "期中" : "期末";

  const classShort = shortClassName(students[0]?.className);

  let h = `<div class="preview-bar">`;
  h += `<div class="preview-title">${classShort} ${examLabel}建议补考名单</div>`;
  h += `<div class="preview-actions">`;
  h += `<button class="btn-back" onclick="render(outputData.students, outputData.mainCols, outputData.extraCols)">← 返回</button>`;
  h += `<button class="btn-dl" onclick="dlMakeup(outputData.students, outputData.mainCols, outputData.extraCols, '${examType}')">下载 Excel</button>`;
  h += `</div></div>`;

  if (Object.keys(groups).length === 0) {
    h += `<div style="text-align:center;padding:60px 0;color:#8f9faa;font-size:14px">没有${examLabel}考试低于70分或缺考的学生</div>`;
    res.innerHTML = h;
    return;
  }

  // Collect byStudent data for stats
  const MAKEUP_ORD = ["听说","读写","托福课程","文书写作","英美文学","文学","数学","物理","化学","生物","语文","经济学/AP计算机","AP心理学","AP研讨会","美国历史","世界历史","中国历史","小语种","美术","戏剧","音乐","体育","计算机","知识论TOK","Capstone"];
  const orderedSubjects = Object.keys(groups).sort((a, b) => {
    const ia = MAKEUP_ORD.indexOf(a); const ib = MAKEUP_ORD.indexOf(b);
    return (ia===-1?999:ia) - (ib===-1?999:ib);
  });

  function cleanClassName(cls) {
    return cls.replace(/^(?:\d{2,4}\s*)?(?:金盏|北外)?\d{0,4}[秋春]\s*/,"").replace(/^\d{2,4}\s+/,"").trim();
  }

  // byStudent
  const byStudent = {};
  let totalEntries = 0;
  for (const subj of orderedSubjects) {
    for (const cls of Object.keys(groups[subj])) {
      for (const e of groups[subj][cls]) {
        if (!byStudent[e.name]) byStudent[e.name] = [];
        byStudent[e.name].push({subject: subj, cls: cleanClassName(cls), score: e.score, absent: e.absent});
        totalEntries++;
      }
    }
  }
  const studentCount = Object.keys(byStudent).length;

  // Stats
  h += `<div style="display:flex;gap:16px;margin-bottom:20px">`;
  h += `<div class="stat-card" style="flex:1;padding:16px 20px"><div style="font-size:11px;color:#8f9faa;margin-bottom:4px">涉及学生</div><div style="font-size:24px;font-weight:700;color:#b8504a">${studentCount}</div></div>`;
  h += `<div class="stat-card" style="flex:1;padding:16px 20px"><div style="font-size:11px;color:#8f9faa;margin-bottom:4px">补考科次</div><div style="font-size:24px;font-weight:700;color:#b8504a">${totalEntries}</div></div>`;
  h += `<div class="stat-card" style="flex:1;padding:16px 20px"><div style="font-size:11px;color:#8f9faa;margin-bottom:4px">涉及科目</div><div style="font-size:24px;font-weight:700;color:#b8504a">${orderedSubjects.length}</div></div>`;
  h += `</div>`;

  // Tab switcher
  h += `<div style="display:flex;gap:8px;margin-bottom:16px">`;
  h += `<button class="btn" id="mkTab1" style="font-weight:600;background:#e3ecf2" onclick="document.getElementById('mkView1').style.display='';document.getElementById('mkView2').style.display='none';this.style.background='#e3ecf2';document.getElementById('mkTab2').style.background=''">按科目</button>`;
  h += `<button class="btn" id="mkTab2" onclick="document.getElementById('mkView2').style.display='';document.getElementById('mkView1').style.display='none';this.style.background='#e3ecf2';document.getElementById('mkTab1').style.background=''">按学生</button>`;
  h += `</div>`;

  // View 1: by subject
  h += `<div id="mkView1"><div class="preview-table-wrap"><table class="preview-table">`;
  h += `<thead><tr><th style="width:100px">科目</th><th style="width:180px">班级</th><th>建议补考学生</th></tr></thead><tbody>`;

  for (const subj of orderedSubjects) {
    const classes = Object.keys(groups[subj]).sort();
    let firstSubj = true;
    let totalRows = classes.length;
    for (const cls of classes) {
      const entries = groups[subj][cls].sort(makeupSortCmp);
      const names = entries.map(e => e.absent
        ? `<span style="display:inline-block;margin:2px 4px;padding:2px 8px;background:#fff6e8;border-radius:4px;font-size:12px">${e.name} <span style="color:#c07f28;font-size:11px;font-weight:600">缺考</span></span>`
        : `<span style="display:inline-block;margin:2px 4px;padding:2px 8px;background:#fdf4f3;border-radius:4px;font-size:12px">${e.name} <span style="color:#c4554d;font-size:11px">${e.score}</span></span>`).join('');
      h += `<tr>`;
      if (firstSubj) {
        h += `<td rowspan="${totalRows}" style="font-weight:600;vertical-align:top;padding-top:12px">${subj}</td>`;
      }
      h += `<td style="text-align:left;padding-left:14px;font-size:12px;color:#666">${cleanClassName(cls)}</td>`;
      h += `<td style="text-align:left;padding-left:10px;line-height:2">${names}</td>`;
      h += `</tr>`;
      firstSubj = false;
    }
  }
  h += `</tbody></table></div></div>`;

  // View 2: by student
  h += `<div id="mkView2" style="display:none"><div class="preview-table-wrap"><table class="preview-table">`;
  h += `<thead><tr><th style="width:80px">姓名</th><th>建议补考科目</th><th style="width:180px">班级</th><th style="width:70px">卷面分数</th></tr></thead><tbody>`;

  const studentNames = Object.keys(byStudent).sort((a,b) => a.localeCompare(b,'zh'));
  for (const name of studentNames) {
    const items = byStudent[name].sort(makeupSortCmp);
    let first = true;
    for (const it of items) {
      h += `<tr${first ? ' class="student-first"' : ''}>`;
      if (first) {
        h += `<td class="cell-name" rowspan="${items.length}">${name}</td>`;
      }
      h += `<td style="font-size:12px">${it.subject}</td>`;
      h += `<td style="font-size:12px;color:#666">${it.cls}</td>`;
      h += it.absent
        ? `<td style="font-weight:600;background:#fff6e8;color:#c07f28">缺考</td>`
        : `<td class="cell-red" style="font-weight:500;background:#fdf4f3">${it.score}</td>`;
      h += `</tr>`;
      first = false;
    }
  }
  h += `</tbody></table></div></div>`;

  res.innerHTML = h;
  window.scrollTo({top: document.querySelector('.wrap').offsetTop, behavior: 'smooth'});
  document.querySelector('.wrap').classList.remove('preview-mode');
}

function previewHomework(students) {
  history.pushState({view:'preview'}, '');
  const res = document.getElementById("results");
  const hwStudents = students.filter(s => s.hwProblems && s.hwProblems.length > 0)
    .sort((a, b) => b.hwProblems.length - a.hwProblems.length);

  const classShort = shortClassName(students[0]?.className);

  let h = `<div class="preview-bar">`;
  h += `<div class="preview-title">${classShort} 问题作业清单</div>`;
  h += `<div class="preview-actions">`;
  h += `<button class="btn-back" onclick="render(outputData.students, outputData.mainCols, outputData.extraCols)">← 返回</button>`;
  h += `<button class="btn-dl" onclick="dlHomework(outputData.students)">下载 Excel</button>`;
  h += `</div></div>`;

  if (hwStudents.length === 0) {
    h += `<div style="text-align:center;padding:60px 0;color:#8f9faa;font-size:14px">没有发现问题作业（得分 ≤ 50）</div>`;

  h += `<div style="display:flex;gap:16px;margin-bottom:20px">`;
  h += `<div class="stat-card" style="flex:1;padding:16px 20px"><div style="font-size:11px;color:#8f9faa;margin-bottom:4px">涉及学生</div><div style="font-size:24px;font-weight:700;color:#cb8a2e">${hwStudents.length}</div></div>`;
  h += `<div class="stat-card" style="flex:1;padding:16px 20px"><div style="font-size:11px;color:#8f9faa;margin-bottom:4px">问题作业总数</div><div style="font-size:24px;font-weight:700;color:#c4554d">${totalProblems}</div></div>`;
  h += `</div>`;

  h += `<div class="preview-table-wrap"><table class="preview-table">`;
  h += `<thead><tr><th class="sticky-col sticky-seq" style="width:40px">#</th><th class="sticky-col sticky-name" style="min-width:70px;text-align:left;padding-left:14px">姓名</th><th>科目</th><th>任课老师</th><th style="min-width:180px">作业名称</th><th style="width:60px">得分</th></tr></thead><tbody>`;

  let seq = 0;
  for (const s of hwStudents) {
    seq++;
    const sorted = [...s.hwProblems].sort((a, b) => a.displayName < b.displayName ? -1 : a.displayName > b.displayName ? 1 : 0);

    // Group by course for rowspan
    const courseGroups = [];
    let curGroup = null;
    for (const hw of sorted) {
      if (!curGroup || curGroup.name !== hw.displayName) {
        curGroup = {name: hw.displayName, teacher: hw.teacher, items: []};
        courseGroups.push(curGroup);
      }
      curGroup.items.push(hw);
    }

    let firstRow = true;
    for (const group of courseGroups) {
      let firstInGroup = true;
      for (const hw of group.items) {
        const borderTop = firstRow ? 'border-top:2px solid #d6dee8;' : '';
        h += `<tr style="${borderTop}">`;
        if (firstRow) {
          h += `<td class="cell-seq sticky-col sticky-seq" rowspan="${sorted.length}">${seq}</td>`;
          h += `<td class="cell-name sticky-col sticky-name" rowspan="${sorted.length}">${s.cnName}</td>`;
        }
        if (firstInGroup) {
          h += `<td rowspan="${group.items.length}" style="font-size:11.5px;border-left:1px solid #e8ecf0">${group.name}</td>`;
          h += `<td rowspan="${group.items.length}" style="font-size:11.5px;color:#8f9faa">${group.teacher}</td>`;
        }
        h += `<td style="text-align:left;padding-left:14px;font-size:11.5px">${hw.hwName}</td>`;
        h += `<td class="cell-red" style="font-weight:500;background:#fdf4f3">${hw.score}</td>`;
        h += `</tr>`;
        firstRow = false;
        firstInGroup = false;
      }
    }
  }

  h += `</tbody></table></div>`;

  res.innerHTML = h;
  window.scrollTo({top: document.querySelector('.wrap').offsetTop, behavior: 'smooth'});
  document.querySelector('.wrap').classList.remove('preview-mode');
}

};
const TRANSCRIPT_EXCLUDE = new Set(["选修","STEAM课程"]);
const TRANSCRIPT_HIGHLIGHT = new Set(["AP Art","French","Spanish","AP Physics C"]);
const TRANSCRIPT_ORDER = {
  "English 8":9,"English 9":10,"English 10":11,"English 11":12,"English 12":13,
  "Geometry":20,"Algebra II":21,"AP Pre-calculus":22,"AP Calculus":23,"AP Statistics":24,

  "AP Psychology":48,"AP Seminar":49,"Theory of Knowledge":50,

  "Chinese 8":64,"Chinese 9":65,"Chinese 10":66,"Chinese 11":67,"Chinese 12":68,
  "AP Art":70,"Art":71,"Music":72,"Drama":73,
  "Physical Education":80,"Capstone":90,
};
const TRANSCRIPT_REG = [
  [97,100,"A+",4.33,0.5],[93,96,"A",4,0.5],[90,92,"A-",3.67,0.5],
  [87,89,"B+",3.33,0.5],[83,86,"B",3,0.5],[80,82,"B-",2.67,0.5],
  [77,79,"C+",2.33,0.5],[73,76,"C",2,0.5],[70,72,"C-",1.67,0.5],
  [67,69,"D+",1.33,0],[63,66,"D",1,0],[60,62,"D-",0.67,0],[0,59,"F",0,0]
];
const TRANSCRIPT_APT = [
  [97,100,"A+",5,0.5],[93,96,"A",4.67,0.5],[90,92,"A-",4.33,0.5],
  [87,89,"B+",4,0.5],[83,86,"B",3.67,0.5],[80,82,"B-",3.33,0.5],
  [77,79,"C+",3,0.5],[73,76,"C",2.67,0.5],[70,72,"C-",2.33,0.5],
  [67,69,"D+",2,0],[63,66,"D",1.67,0],[60,62,"D-",1.33,0],[0,59,"F",0,0]
];
function transcriptLookup(score, isAP) {
  const r = Math.round(score), t = isAP ? TRANSCRIPT_APT : TRANSCRIPT_REG;
  for (const [lo,hi,g,gpa,cr] of t) if (r>=lo&&r<=hi) return {grade:g,gpa,cr};
  return {grade:"F",gpa:0,cr:0};
}

function buildTranscriptData(students) {
  // Extract grade & semester label from first student's semester string
  let schoolYear = "2025-2026", semNum = "1", gradeNum = "10";
  for (const s of students) {
    if (s.semester) {
      const ym = s.semester.match(/(\d{4}-\d{4})学年/);
      if (ym) schoolYear = ym[1];
      const sm = s.semester.match(/第(\d)学期/);
      if (sm) semNum = sm[1];
    }
    if (s.className) {
      const gm = s.className.match(/(\d{1,2})年级\d+班/);
      if (gm) { gradeNum = gm[1]; break; }
    }
  }
  const ordinal = {8:"8th",9:"9th",10:"10th",11:"11th",12:"12th"}[gradeNum] || gradeNum+"th";
  const semLabel = `${ordinal}, ${schoolYear}  Sem ${semNum}`;

  const out = [];
  const unmapped = new Set();

  for (const s of students) {
    const engScores = [];
    const engDetails = [];
    const chnScores = [];
    const standalone = [];

    for (const displayName of Object.keys(s.courses)) {
      const c = s.courses[displayName];
      const courseCN = c.courseCN || displayName;
      if (TRANSCRIPT_EXCLUDE.has(courseCN)) continue;
      const semScore = c.semScore;
      if (semScore === null || semScore === undefined || typeof semScore !== "number") continue;

      const en = TRANSCRIPT_MAP[courseCN];
      if (!en) {
        standalone.push({engName: courseCN, score: semScore});
        unmapped.add(courseCN);
        continue;
      }
      if (en === "_ENG") {
        engScores.push(semScore);
        engDetails.push({name: courseCN, score: semScore});
      } else if (en === "_CHN") {
        chnScores.push(semScore);
      } else {
        standalone.push({engName: en, score: semScore});
      }
    }

    const final = [];
    if (engScores.length > 0) {
      const avg = engScores.reduce((a,b)=>a+b,0) / engScores.length;
      const detail = engDetails.map(d => `${d.name} ${d.score}`).join(" / ");
      final.push({engName:`English ${gradeNum}`, score: Math.round(avg*10)/10, engDetail: detail});
    }
    if (chnScores.length > 0) {
      const avg = chnScores.reduce((a,b)=>a+b,0) / chnScores.length;
      final.push({engName:`Chinese ${gradeNum}`, score: Math.round(avg*10)/10});
    }
    for (const c of standalone) final.push(c);

    final.sort((a,b) => {
      const oa = TRANSCRIPT_ORDER[a.engName] ?? 95;
      const ob = TRANSCRIPT_ORDER[b.engName] ?? 95;
      return oa - ob;
    });

    const rows = final.map(c => {
      const isAP = c.engName.startsWith("AP ");
      const {grade, gpa, cr} = transcriptLookup(c.score, isAP);
      const highlight = TRANSCRIPT_HIGHLIGHT.has(c.engName);
      return {...c, isAP, grade, gpa, cr, w: gpa*cr, highlight};
    });

    const tCr = rows.reduce((s,r)=>s+r.cr, 0);
    const tW = rows.reduce((s,r)=>s+r.w, 0);
    out.push({
      fullName: s.fullName,
      cnName: s.cnName,
      engName: s.engName,
      semLabel,
      rows, tCr, tW,
      gpa: tCr > 0 ? tW/tCr : 0,
    });
  }
  return {transcripts: out, unmapped: [...unmapped]};
}

async function dlTranscript(students) {
  const {transcripts} = buildTranscriptData(students);
  if (transcripts.length === 0) { alert("没有可用的学期综合成绩数据"); return; }

  const FONT = {name:"Arial", size:10};
  const BORDER_TB = {top:{style:"thin"},bottom:{style:"thin"}};
  const NUM2 = '0.00';
  const V = "middle";

  const wb = new ExcelJS.Workbook();
  for (const t of transcripts) {
    const sheetName = (t.cnName || "Sheet").slice(0,31);
    const ws = wb.addWorksheet(sheetName);
    ws.columns = [{width:4},{width:30},{width:4},{width:10},{width:7},{width:9},{width:6},{width:40}];

    ws.addRow([]);
    const r2 = ws.addRow(["", t.fullName]);
    r2.getCell(2).font = {...FONT, bold:true};
    r2.getCell(2).alignment = {vertical:V};
    ws.addRow([]);

    const r4 = ws.addRow(["", t.semLabel, "", "Grade", "", "GPA", "Cr"]);
    ws.mergeCells(4, 4, 4, 5);
    for (let ci = 2; ci <= 7; ci++) {
      const cell = r4.getCell(ci);
      cell.font = {...FONT, bold:true};
      cell.border = BORDER_TB;
      cell.alignment = {vertical:V};
    }
    r4.getCell(4).alignment = {horizontal:"center", vertical:V};
    r4.getCell(6).alignment = {horizontal:"center", vertical:V};
    r4.getCell(7).alignment = {horizontal:"center", vertical:V};

    for (const r of t.rows) {
      const row = ws.addRow(["", r.engName, "", r.score, r.grade, r.gpa, r.cr]);
      const f = r.highlight ? {...FONT, color:{argb:"FFFF0000"}} : FONT;
      row.eachCell(c => { c.font = f; c.alignment = {vertical:V}; });
      if (r.cr === 0) {
        const yFill = {type:"pattern", pattern:"solid", fgColor:{argb:"FFFFFF00"}};
        for (let ci = 2; ci <= 7; ci++) row.getCell(ci).fill = yFill;
      }
      row.getCell(5).alignment = {horizontal:"left", indent:1, vertical:V};
      row.getCell(6).alignment = {horizontal:"center", vertical:V};
      row.getCell(6).numFmt = NUM2;
      row.getCell(7).alignment = {horizontal:"center", vertical:V};
      row.getCell(7).numFmt = NUM2;
      if (r.engDetail) {
        row.getCell(8).value = r.engDetail;
        row.getCell(8).font = {...FONT, color:{argb:"FF888888"}};
        row.getCell(8).alignment = {vertical:V};
      }
    }

    const sub = ws.addRow(["", "Subtotal", "", "", "", Math.round(t.gpa*1000000)/1000000, t.tCr]);
    sub.eachCell(c => { c.font = FONT; c.alignment = {vertical:V}; });
    sub.getCell(6).alignment = {horizontal:"center", vertical:V};
    sub.getCell(6).numFmt = NUM2;
    sub.getCell(7).alignment = {horizontal:"center", vertical:V};
    sub.getCell(7).numFmt = NUM2;
  }

  const buf = await wb.xlsx.writeBuffer();
  const blob = new Blob([buf], {type:"application/octet-stream"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "本学期GPA成绩单.xlsx";
  a.click();
  URL.revokeObjectURL(a.href);
}

    for (let j = 0; j < cfg.scoreHeaders.length; j++) {
      const lightCls = (cfg.lightCol !== null && j === cfg.lightCol) ? ' style="color:#8FAABE"' : '';
      h += `<td${lightCls}>${avgs[j] !== null && avgs[j] !== undefined ? avgs[j].toFixed(1) : ''}</td>`;
    }
    h += `</tr>`;

    // 音体美
    if (stuExtraCols.length > 0) {
      h += `<tr class="sc-extra-hdr"><td colspan="${cfg.scoreHeaders.length + 1}">音体美</td></tr>`;
      for (const col of stuExtraCols) {
        const course = s.courses[col];
        const scores = course ? cfg.getExtraScores(course) : [];
        h += `<tr class="sc-extra"><td>${col}</td>`;
        for (let j = 0; j < cfg.scoreHeaders.length; j++) {
          const v = scores[j];
          h += `<td>${typeof v === 'number' ? v : ''}</td>`;
        }
        h += `</tr>`;
      }
    }

    h += `</tbody></table></div>`;

    // Footer: trend + GPA
    const trend = cfg.getTrend ? cfg.getTrend(s, stuMainCols) : null;
    const gpa = withGPA ? calcStudentGPA(s) : null;
    if (trend !== null || gpa !== null) {
      h += `<div class="score-card-footer">`;
      if (trend !== null) {
        const tColor = trend >= 0 ? '#3e7a60' : '#c4554d';
        const tBg = trend >= 0 ? '#f0f8f2' : '#fdf4f3';
        h += `<span class="score-card-trend" style="color:${tColor};background:${tBg};padding:3px 10px;border-radius:6px">均分趋势 ${trend >= 0 ? '+' : ''}${trend.toFixed(1)}</span>`;
      }
      if (gpa !== null) {
        h += `<span class="score-card-gpa">GPA ${gpa.toFixed(2)}</span>`;
      }
      h += `</div>`;
    }

    h += `</div>`; // end score-card
  }

  h += `</div>`; // end cards-grid

  res.innerHTML = h;
  window.scrollTo({top: document.querySelector('.wrap').offsetTop, behavior: 'smooth'});
  document.querySelector('.wrap').classList.add('preview-mode');
}

// ===== 统一视图：全班分析 / 个人成绩条（勾选驱动，v1）=====
const EXAM_DEFS = [
  { key: 'test',  label: '月考',     type: '月考卷面', fn: c => c.testScore },
  { key: 'mid',   label: '期中',     type: '期中卷面', fn: c => c.midScore },
  { key: 'final', label: '期末',     type: '期末卷面', fn: c => c.finalScore },
  { key: 'sem',   label: '综合成绩', type: '综合成绩', fn: c => c.semScore },
];
const EXAM_ORDER = ['test', 'mid', 'final', 'sem'];
let unifiedMode = 'class';
let unifiedSel = { exams: [], gpa: false };

function openUnified(mode) {
  history.pushState({ view: 'preview' }, '');
  unifiedMode = mode;
  unifiedSel = { exams: [], gpa: false };
  drawUnified();
  window.scrollTo({ top: document.querySelector('.wrap').offsetTop, behavior: 'smooth' });
  document.querySelector('.wrap').classList.add('preview-mode');
}
function toggleUnifiedExam(key) {
  const i = unifiedSel.exams.indexOf(key);
  if (i >= 0) {
    unifiedSel.exams.splice(i, 1);
  } else {
    unifiedSel.exams.push(key);
    unifiedSel.exams.sort((a, b) => EXAM_ORDER.indexOf(a) - EXAM_ORDER.indexOf(b));
  }
  drawUnified();
}
function toggleUnifiedGPA() { unifiedSel.gpa = !unifiedSel.gpa; drawUnified(); }

// 现有导出函数的组合映射（其余组合待第二步统一生成器接入）
function unifiedDlInfo() {
  const paper = unifiedSel.exams.filter(k => k !== 'sem').join('+');
  const hasSem = unifiedSel.exams.includes('sem');
  const map = {
    'test':      { cls: 'dlExcel',    ind: 'dlExcelIndiv' },
    'test+mid':  { cls: 'dlCompare',  ind: 'dlCompareIndiv' },
    'mid+final': { cls: 'dlMidFinal', ind: 'dlMidFinalIndiv' },
  };
  const m = map[paper];
  if (!m) return null;
  return { fn: unifiedMode === 'class' ? m.cls : m.ind, noSem: !hasSem };
}

function unifiedClassShort(students) {
  return shortClassName(students[0]?.className);
}

function drawUnified() {
  const res = document.getElementById('results');
  const { students, mainCols, extraCols } = outputData;
  const sel = unifiedSel.exams.map(k => EXAM_DEFS.find(d => d.key === k));
  let h = `<div class="preview-bar">`;
  h += `<div class="preview-title">${unifiedClassShort(students)} ${unifiedMode === 'class' ? '全班成绩分析' : '学生个人成绩条'}</div>`;
  h += `<div class="preview-actions">`;
  h += `<button class="btn-back" onclick="render(outputData.students, outputData.mainCols, outputData.extraCols)">← 返回</button>`;
  if (unifiedSel.exams.length > 0) h += `<button class="btn-dl" onclick="${unifiedMode === 'class' ? 'dlUnified' : 'dlUnifiedIndiv'}(outputData.students, outputData.mainCols, outputData.extraCols)">下载 Excel</button>`;
  else h += `<button class="btn-dl" disabled style="opacity:0.45;cursor:not-allowed" title="先勾选成绩项">下载 Excel</button>`;
  h += `</div></div>`;

  // 勾选栏
  h += `<div class="filter-bar"><span class="filter-label">显示项</span>`;
  for (const d of EXAM_DEFS) {
    const on = unifiedSel.exams.includes(d.key);
    h += `<button class="chip${on ? ' on' : ''}" onclick="toggleUnifiedExam('${d.key}')"><span class="chip-check">✓</span>${d.label}</button>`;
  }
  h += `<button class="chip chip-gpa${unifiedSel.gpa ? ' on' : ''}" onclick="toggleUnifiedGPA()"><span class="chip-check">✓</span>美高GPA</button>`;
  h += `</div>`;

  if (sel.length === 0) {
    h += `<div class="unified-hint">在上方勾选需要显示的成绩项，生成成绩数据。</div>`;
    h += unifiedMode === 'class'
      ? buildRosterClassHTML(students)
      : buildRosterIndivHTML(students, mainCols, extraCols);
  } else {
    h += unifiedMode === 'class'
      ? buildUnifiedClassHTML(students, mainCols, extraCols, sel)
      : buildUnifiedIndivHTML(students, mainCols, extraCols, sel);
  }

  res.innerHTML = h;
}

// ── 空选状态下的名单视图：显示学生，不显示成绩 ──
function buildRosterClassHTML(students) {
  let h = `<div class="preview-table-wrap"><table class="preview-table"><thead><tr>`;
  h += `<th style="width:48px">#</th><th style="text-align:left;padding-left:14px">姓名</th>`;
  h += `</tr></thead><tbody>`;
  students.forEach((s, i) => {
    h += `<tr class="student-first"><td class="cell-seq">${i + 1}</td><td class="cell-name" style="text-align:left;padding-left:14px">${s.cnName}</td></tr>`;
  });
  h += `</tbody></table></div>`;
  return h;
}

function buildRosterIndivHTML(students, mainCols, extraCols) {
  let h = `<div class="cards-grid">`;
  for (const s of students) {
    const stuMain = mainCols.filter(col => s.courses[col]);
    const stuExtra = extraCols.filter(col => s.courses[col]);
    h += `<div class="score-card"><div class="score-card-header">`;
    h += `<div class="score-card-name">${s.cnName}</div></div>`;
    h += `<div class="score-card-body"><table class="score-card-table"><thead><tr><th>科目</th></tr></thead><tbody>`;
    for (const col of stuMain) h += `<tr><td>${col}</td></tr>`;
    if (stuExtra.length) {
      h += `<tr class="sc-extra-hdr"><td>音体美</td></tr>`;
      for (const col of stuExtra) h += `<tr class="sc-extra"><td>${col}</td></tr>`;
    }
    h += `</tbody></table></div></div>`;
  }
  h += `</div>`;
  return h;
}

function buildUnifiedClassHTML(students, mainCols, extraCols, sel) {
  const paperSel = sel.filter(d => d.key !== 'sem');
  const sortDef = paperSel.length ? paperSel[paperSel.length - 1] : sel[sel.length - 1];
  const sorted = [...students].sort((a, b) => {
    const aa = calcAvg(a, mainCols, sortDef.fn), bb = calcAvg(b, mainCols, sortDef.fn);
    return (bb ?? -Infinity) - (aa ?? -Infinity);
  });

  let h = `<div class="preview-table-wrap"><table class="preview-table"><thead><tr>`;
  h += `<th class="sticky-col sticky-seq" style="width:40px">#</th>`;
  h += `<th class="sticky-col sticky-name" style="min-width:70px;text-align:left;padding-left:14px">姓名</th>`;
  h += `<th class="sticky-col sticky-type" style="width:68px">类别</th>`;
  for (const col of mainCols) h += `<th>${DISPLAY_MAP[col] || col}</th>`;
  h += `<th style="background:#dceef8;color:#1a9be0">均分</th>`;
  const showTrend = paperSel.length >= 2;
  if (showTrend) h += `<th style="background:#e8f5e8;color:#3e7a60">趋势</th>`;
  if (unifiedSel.gpa) h += `<th style="background:#e8f5e8;color:#3e7a60">GPA</th>`;
  for (const col of extraCols) h += `<th>${DISPLAY_MAP[col] || col}</th>`;
  h += `</tr></thead><tbody>`;

  const trendTd = (v, extraAttr = '') => v !== null
    ? `<td${extraAttr} style="font-weight:500;${v >= 0 ? 'color:#3e7a60;background:#f0f8f2' : 'color:#c4554d;background:#fdf4f3'}">${(v >= 0 ? '+' : '') + v.toFixed(1)}</td>`
    : `<td${extraAttr}></td>`;

  for (let si = 0; si < sorted.length; si++) {
    const s = sorted[si];
    const rspan = sel.length > 1 ? ` rowspan="${sel.length}"` : '';
    sel.forEach((d, di) => {
      const isPaper = d.key !== 'sem';
      h += `<tr class="${di === 0 ? 'student-first ' : ''}${isPaper ? 'row-test' : 'row-sem'}">`;
      if (di === 0) {
        h += `<td class="cell-seq sticky-col sticky-seq"${rspan}>${si + 1}</td>`;
        h += `<td class="cell-name sticky-col sticky-name"${rspan}>${s.cnName}</td>`;
      }
      h += `<td class="cell-type sticky-col sticky-type">${d.type}</td>`;
      for (const col of mainCols) {
        const c = s.courses[col];
        const v = c ? d.fn(c) : null;
        if (c && typeof v !== 'number' && isPaper && v !== null && v !== undefined) h += `<td class="cell-orange"></td>`;
        else if (typeof v === 'number') h += `<td${isPaper && v < 70 ? ' class="cell-red"' : ''}>${v}</td>`;
        else h += `<td></td>`;
      }
      const avg = calcAvg(s, mainCols, d.fn);
      h += `<td class="cell-avg">${avg !== null ? avg.toFixed(1) : ''}</td>`;
      if (showTrend) {
        if (paperSel.length === 2) {
          // 两次卷面考试：沿用旧样式，合并单元格显示 新-旧
          if (di === 0) {
            const a = calcAvg(s, mainCols, paperSel[0].fn);
            const b = calcAvg(s, mainCols, paperSel[1].fn);
            const t = (a !== null && b !== null) ? Math.round((b - a) * 10) / 10 : null;
            h += trendTd(t, rspan);
          }
        } else {
          // 三次卷面考试：趋势逐行显示——本行考试相对上一次的均分变化
          const p = paperSel.indexOf(d);
          if (p > 0) {
            const a = calcAvg(s, mainCols, paperSel[p - 1].fn);
            const b = calcAvg(s, mainCols, d.fn);
            const t = (a !== null && b !== null) ? Math.round((b - a) * 10) / 10 : null;
            h += trendTd(t);
          } else {
            h += `<td></td>`;
          }
        }
      }
      if (di === 0 && unifiedSel.gpa) {
        const g = calcStudentGPA(s);
        h += `<td${rspan} style="font-weight:500;color:#3e7a60">${g !== null ? g.toFixed(2) : ''}</td>`;
      }
      for (const col of extraCols) {
        const c = s.courses[col];
        const v = c ? d.fn(c) : null;
        h += `<td>${typeof v === 'number' ? v : ''}</td>`;
      }
      h += `</tr>`;
    });
  }
  h += `</tbody></table></div>`;
  h += buildUnifiedStatsHTML(sorted, mainCols, sel);
  return h;
}

function buildUnifiedStatsHTML(students, mainCols, sel) {
  const per = sel.map(d => {
    const st = {};
    for (const col of mainCols) st[col] = subjectStats(students, col, d.fn);
    return st;
  });
  const avgOf = vals => {
    const v = vals.filter(x => typeof x === 'number');
    return v.length ? v.reduce((a, b) => a + b, 0) / v.length : null;
  };
  let h = `<div class="ustats-wrap"><table class="preview-table ustats"><thead><tr>`;
  h += `<th style="text-align:left;padding-left:14px;min-width:120px">统计</th>`;
  for (const col of mainCols) h += `<th>${DISPLAY_MAP[col] || col}</th>`;
  h += `<th style="background:#dceef8;color:#1a9be0">平均</th></tr></thead><tbody>`;
  // 学科趋势：相邻两场卷面考试之间逐科对比。均分=相对变化百分比，及格率/优秀率=百分点差值。
  const paperSel2 = sel.filter(d => d.key !== 'sem');
  const paperPairs = [];
  for (let i = 1; i < paperSel2.length; i++) paperPairs.push([sel.indexOf(paperSel2[i - 1]), sel.indexOf(paperSel2[i])]);
  const trendOf = (m, i, j, col) => {
    const a = per[i][col]?.[m], b = per[j][col]?.[m];
    if (typeof a !== 'number' || typeof b !== 'number') return null;
    if (m === 'avg') return a !== 0 ? (b - a) / a : null;
    return b - a;
  };
  const trendCellHtml = v => v !== null
    ? `<td style="font-weight:500;${v >= 0 ? 'color:#3e7a60;background:#f0f8f2' : 'color:#c4554d;background:#fdf4f3'}">${(v >= 0 ? '+' : '') + Math.round(v * 100) + '%'}</td>`
    : `<td></td>`;

  const groups = [
    { name: '均分',   metric: 'avg',   fmt: v => Math.round(v) },
    { name: '及格率', metric: 'pass',  fmt: v => Math.round(v * 100) + '%' },
    { name: '优秀率', metric: 'excel', fmt: v => Math.round(v * 100) + '%' },
  ];
  for (const g of groups) {
    sel.forEach((d, di) => {
      const vals = mainCols.map(c => per[di][c]?.[g.metric] ?? null);
      const a = avgOf(vals);
      h += `<tr class="${di === 0 ? 'ustats-group' : ''}">`;
      h += `<td style="text-align:left;padding-left:14px;font-weight:500">${d.label}${g.name}</td>`;
      for (const v of vals) h += `<td>${typeof v === 'number' ? g.fmt(v) : ''}</td>`;
      h += `<td class="cell-avg">${a !== null ? g.fmt(a) : ''}</td></tr>`;
    });
    for (const [i, j] of paperPairs) {
      const label = paperPairs.length > 1 ? `趋势 ${sel[i].label}→${sel[j].label}` : '趋势';
      const vals = mainCols.map(c => trendOf(g.metric, i, j, c));
      const nums = vals.filter(v => typeof v === 'number');
      // 平均列：全科口径下同一公式
      const aAll = avgOf(mainCols.map(c => per[i][c]?.[g.metric] ?? null));
      const bAll = avgOf(mainCols.map(c => per[j][c]?.[g.metric] ?? null));
      let tAll = null;
      if (aAll !== null && bAll !== null) tAll = g.metric === 'avg' ? (aAll !== 0 ? (bAll - aAll) / aAll : null) : bAll - aAll;
      h += `<tr><td style="text-align:left;padding-left:14px;font-weight:600;background:#faf0fd;color:#8a4ba0">${label}</td>`;
      for (const v of vals) h += trendCellHtml(v);
      h += trendCellHtml(tAll);
      h += `</tr>`;
    }
  }
  h += `</tbody></table></div>`;
  return h;
}

function buildTrendBlock(points) {
  // points: [{label, v}]。学期均分趋势区块。
  // 折线放在横向可拉伸的SVG里（vector-effect保持线宽恒定），
  // 节点圆点、考试名、均分/趋势气泡都是固定字号的HTML，不随卡片宽度缩放。
  const pts = points.filter(p => typeof p.v === 'number');
  if (pts.length < 2) return null;
  const W = 300, CH = 44, PADT = 8, PLOT_H = 26;
  const n = pts.length;
  const xPct = i => (2 * i + 1) / (2 * n) * 100;
  const vs = pts.map(p => p.v);
  const min = Math.min(...vs), max = Math.max(...vs);
  const span = (max - min) || 1;
  const y = v => PADT + PLOT_H * (1 - (v - min) / span);
  const line = pts.map((p, i) => `${(xPct(i) / 100 * W).toFixed(1)},${y(p.v).toFixed(1)}`).join(' ');
  const gid = 'tg' + (buildTrendBlock._seq = (buildTrendBlock._seq || 0) + 1);
  const areaPts = `${(xPct(0) / 100 * W).toFixed(1)},${CH} ${line} ${(xPct(n - 1) / 100 * W).toFixed(1)},${CH}`;

  let h = `<div class="trend-block">`;
  h += `<div class="trend-block-head"><span class="trend-block-title">学期均分趋势</span></div>`;
  h += `<div class="trend-chart">`;
  h += `<svg viewBox="0 0 ${W} ${CH}" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">`;
  h += `<defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#1a9be0" stop-opacity="0.22"/><stop offset="100%" stop-color="#1a9be0" stop-opacity="0"/></linearGradient></defs>`;
  h += `<polygon points="${areaPts}" fill="url(#${gid})"/>`;
  h += `<polyline points="${line}" fill="none" stroke="#1a9be0" stroke-width="1.5" vector-effect="non-scaling-stroke"/></svg>`;
  pts.forEach((p, i) => {
    h += `<span class="trend-dot" style="left:${xPct(i).toFixed(2)}%;top:${y(p.v).toFixed(1)}px" title="${p.label}均分 ${p.v}"></span>`;
  });
  h += `</div>`;
  h += `<div class="trend-grid" style="grid-template-columns:repeat(${n},1fr)">`;
  pts.forEach((p, i) => {
    h += `<div>`;
    h += `<div class="trend-name">${p.label}</div>`;
    if (i === 0) {
      h += `<span class="trend-val">${p.v.toFixed(1)}</span>`;
    } else {
      const d = Math.round((p.v - pts[i - 1].v) * 10) / 10;
      h += `<span class="trend-pill ${d >= 0 ? 'up' : 'down'}">${(d >= 0 ? '+' : '') + d.toFixed(1)}</span>`;
    }
    h += `</div>`;
  });
  h += `</div></div>`;
  return h;
}

function buildUnifiedIndivHTML(students, mainCols, extraCols, sel) {
  const paperSel = sel.filter(d => d.key !== 'sem');
  const sortDef = paperSel.length ? paperSel[paperSel.length - 1] : sel[sel.length - 1];
  const hiIdx = paperSel.length ? sel.indexOf(paperSel[paperSel.length - 1]) : -1;
  const lightIdxs = new Set(paperSel.slice(0, -1).map(d => sel.indexOf(d)));

  const sorted = [...students].sort((a, b) => {
    const aa = calcAvg(a, mainCols, sortDef.fn), bb = calcAvg(b, mainCols, sortDef.fn);
    return (bb ?? -Infinity) - (aa ?? -Infinity);
  });

  let h = `<div class="cards-grid">`;
  for (const s of sorted) {
    const stuMain = mainCols.filter(col => {
      const c = s.courses[col];
      return c && sel.some(d => { const v = d.fn(c); return v !== null && v !== undefined; });
    });
    const stuExtra = extraCols.filter(col => {
      const c = s.courses[col];
      return c && sel.some(d => typeof d.fn(c) === 'number');
    });

    h += `<div class="score-card"><div class="score-card-header">`;
    h += `<div class="score-card-name">${s.cnName}</div>`;
    h += `<div class="score-card-sub">${sel.map(d => d.label).join(' / ')}</div></div>`;
    h += `<div class="score-card-body"><table class="score-card-table"><thead><tr><th>科目</th>`;
    for (const d of sel) h += `<th>${d.label}</th>`;
    h += `</tr></thead><tbody>`;

    for (const col of stuMain) {
      const c = s.courses[col];
      h += `<tr><td>${col}</td>`;
      sel.forEach((d, j) => {
        const v = c ? d.fn(c) : null;
        const isNum = typeof v === 'number';
        const isPaper = d.key !== 'sem';
        if (!isNum && c && isPaper && v !== null && v !== undefined) {
          if (j === hiIdx) h += `<td class="sc-orange"></td>`;
          else if (lightIdxs.has(j)) h += `<td style="color:#bbb;font-size:11px">缺考</td>`;
          else h += `<td></td>`;
        } else {
          let cls = '';
          if (lightIdxs.has(j)) cls = ' class="sc-light"';
          if (isNum && v < 70 && j === hiIdx) cls = ' class="sc-red"';
          h += `<td${cls}>${isNum ? v : ''}</td>`;
        }
      });
      h += `</tr>`;
    }

    h += `<tr class="sc-avg"><td>均分</td>`;
    const avgByIdx = sel.map(d => calcAvg(s, stuMain, d.fn));
    sel.forEach((d, j) => {
      const light = lightIdxs.has(j) ? ' style="color:#8FAABE"' : '';
      h += `<td${light}>${avgByIdx[j] !== null ? avgByIdx[j].toFixed(1) : ''}</td>`;
    });
    h += `</tr>`;

    if (stuExtra.length) {
      h += `<tr class="sc-extra-hdr"><td colspan="${sel.length + 1}">音体美</td></tr>`;
      for (const col of stuExtra) {
        const c = s.courses[col];
        h += `<tr class="sc-extra"><td>${col}</td>`;
        for (const d of sel) { const v = c ? d.fn(c) : null; h += `<td>${typeof v === 'number' ? v : ''}</td>`; }
        h += `</tr>`;
      }
    }
    h += `</tbody></table></div>`;

    // Footer：趋势 + 迷你趋势线 + GPA
    const gpa = unifiedSel.gpa ? calcStudentGPA(s) : null;
    const gpaHtml = gpa !== null ? `<span class="score-card-gpa">GPA ${gpa.toFixed(2)}</span>` : '';
    let footerDone = false;
    if (paperSel.length >= 3) {
      // 三场卷面考试：GPA（如勾选）自成一行，学期均分趋势区块在其下方
      const block = buildTrendBlock(paperSel.map(d => ({ label: d.label, v: calcAvg(s, stuMain, d.fn) })));
      if (block) {
        if (gpaHtml) h += `<div class="score-card-footer">${gpaHtml}</div>`;
        h += block;
        footerDone = true;
      }
    } else if (paperSel.length === 2) {
      // 两场卷面考试：不画折线，只显示趋势数值气泡
      const a = calcAvg(s, stuMain, paperSel[0].fn);
      const b = calcAvg(s, stuMain, paperSel[1].fn);
      const trend = (a !== null && b !== null) ? Math.round((b - a) * 10) / 10 : null;
      if (trend !== null || gpa !== null) {
        h += `<div class="score-card-footer">`;
        if (trend !== null) {
          const tc = trend >= 0 ? '#3e7a60' : '#c4554d', tb = trend >= 0 ? '#f0f8f2' : '#fdf4f3';
          h += `<span class="score-card-trend" style="color:${tc};background:${tb};padding:3px 10px;border-radius:6px">均分趋势 ${trend >= 0 ? '+' : ''}${trend.toFixed(1)}</span>`;
        }
        h += gpaHtml;
        h += `</div>`;
        footerDone = true;
      }
    }
    if (!footerDone && gpa !== null) {
      h += `<div class="score-card-footer">${gpaHtml}</div>`;
    }
    h += `</div>`;
  }
  h += `</div>`;
  return h;
}

function render(students, mainCols, extraCols) {

const dropZone = document.getElementById("dropZone");
const fileInput = document.getElementById("fileInput");
dropZone.addEventListener("click", () => fileInput.click());
dropZone.addEventListener("dragover", e => { e.preventDefault(); dropZone.classList.add("over"); });
dropZone.addEventListener("dragleave", () => dropZone.classList.remove("over"));
dropZone.addEventListener("drop", e => { e.preventDefault(); dropZone.classList.remove("over"); handleFile(e.dataTransfer.files[0]); });
fileInput.addEventListener("change", e => { if(e.target.files[0]) handleFile(e.target.files[0]); });

function handleFile(file) {
  document.getElementById("errBox").style.display = "none";
  document.getElementById("warnBox").style.display = "none";
  document.getElementById("results").innerHTML = "";
  document.getElementById("dropText").textContent = `已选择：${file.name}`;
  document.getElementById("dropZone").classList.add("has-file");
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const students = parseFile(new Uint8Array(e.target.result));
      if (!students.length) {
        document.getElementById("errBox").textContent = "未找到学生成绩数据。";
        document.getElementById("errBox").style.display = "block";
        return;
      }
      outputData = buildOutput(students);
      jwStashSeed(new Uint8Array(e.target.result), file.name);  // 教务成绩单子页自动带入该文件
      render(outputData.students, outputData.mainCols, outputData.extraCols);
    } catch(err) {
      document.getElementById("errBox").textContent = `处理出错：${err.message}`;
      document.getElementById("errBox").style.display = "block";
    }
  };
  reader.readAsArrayBuffer(file);
}

function goHome() {
  if (outputData) render(outputData.students, outputData.mainCols, outputData.extraCols);
  else render(null, [], []);
}
function go(fn) {
  if (!outputData) { showNeedUpload(); return; }
  fn();
}
function showNeedUpload() {
  history.pushState({view: 'preview'}, '');
  const res = document.getElementById("results");
  res.innerHTML = `<div class="preview-bar"><div class="preview-title"></div><div class="preview-actions">` +
    `<button class="btn-back" onclick="goHome()">← 返回</button></div></div>` +
    `<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;padding:110px 20px 130px;gap:18px">` +
    `<div style="font-size:32px;opacity:.5">📂</div>` +
    `<div style="font-size:15px;color:#5d6d7a;letter-spacing:.02em">请上传校宝中导出的班级成绩文件以生成成绩分析</div>` +
    `<button class="btn btn-blue" style="padding:10px 28px;font-size:13px" onclick="document.getElementById('fileInput').click()">选择成绩文件</button>` +
    `</div>`;
  window.scrollTo({top: 0, behavior: 'smooth'});
}

window.addEventListener('popstate', function() {
  goHome();
});

// 初始：未上传文件也先渲染功能区块
goHome();

// ─── 最小 ZIP 打包器（STORE 无压缩，足够 docx 使用）─────
const JW_CRC_TABLE = (() => {
  const t = new Uint32Array(256);
  for (let n = 0; n < 256; n++) {
    let c = n;
    for (let k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
    t[n] = c >>> 0;
  }
  return t;
})();

function jwCrc32(bytes) {
  let c = 0xFFFFFFFF;
  for (let i = 0; i < bytes.length; i++) c = JW_CRC_TABLE[(c ^ bytes[i]) & 0xFF] ^ (c >>> 8);
  return (c ^ 0xFFFFFFFF) >>> 0;
}

function jwZip(entries) {
  const chunks = [], central = [];
  let offset = 0;
  const now = new Date();
  const dosTime = (now.getHours() << 11) | (now.getMinutes() << 5) | Math.floor(now.getSeconds() / 2);
  const dosDate = (((now.getFullYear() - 1980) & 0x7F) << 9) | ((now.getMonth() + 1) << 5) | now.getDate();
  const enc = new TextEncoder();
  for (const e of entries) {
    const nameB = enc.encode(e.name);
    const crc = jwCrc32(e.data);
    const lh = new DataView(new ArrayBuffer(30));
    lh.setUint32(0, 0x04034b50, true);
    lh.setUint16(4, 20, true);
    lh.setUint16(6, 0x0800, true);   // UTF-8 文件名
    lh.setUint16(8, 0, true);        // STORE
    lh.setUint16(10, dosTime, true);
    lh.setUint16(12, dosDate, true);
    lh.setUint32(14, crc, true);
    lh.setUint32(18, e.data.length, true);
    lh.setUint32(22, e.data.length, true);
    lh.setUint16(26, nameB.length, true);
    lh.setUint16(28, 0, true);
    chunks.push(new Uint8Array(lh.buffer), nameB, e.data);
    const cd = new DataView(new ArrayBuffer(46));
    cd.setUint32(0, 0x02014b50, true);
    cd.setUint16(4, 20, true);
    cd.setUint16(6, 20, true);
    cd.setUint16(8, 0x0800, true);
    cd.setUint16(10, 0, true);
    cd.setUint16(12, dosTime, true);
    cd.setUint16(14, dosDate, true);
    cd.setUint32(16, crc, true);
    cd.setUint32(20, e.data.length, true);
    cd.setUint32(24, e.data.length, true);
    cd.setUint16(28, nameB.length, true);
    cd.setUint32(42, offset, true);
    central.push(new Uint8Array(cd.buffer), nameB);
    offset += 30 + nameB.length + e.data.length;
  }
  let cdSize = 0;
  for (const c of central) cdSize += c.length;
  const eocd = new DataView(new ArrayBuffer(22));
  eocd.setUint32(0, 0x06054b50, true);
  eocd.setUint16(8, entries.length, true);
  eocd.setUint16(10, entries.length, true);
  eocd.setUint32(12, cdSize, true);
  eocd.setUint32(16, offset, true);
  chunks.push(...central, new Uint8Array(eocd.buffer));
  return new Blob(chunks, {type: "application/vnd.openxmlformats-officedocument.wordprocessingml.document"});
}
