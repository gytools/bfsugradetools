function jwEsc(s) {
  return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}

const JW_GRADE_CN_NUM = {9: "九", 10: "十", 11: "十一", 12: "十二"};
const JW_MONTHS_EN = ["January","February","March","April","May","June","July","August","September","October","November","December"];

// 表格里的分数：整数原样，非整数保留 1 位小数
function jwScoreStr(v) {
  const r = Math.round(v * 10) / 10;
  return Number.isInteger(r) ? String(r) : r.toFixed(1);
}

// 黑字 / 红字 runs（兹证明段落用，红字与模板一致 = 需人工核对/填写）
function jwRunB(t) {
  return `<w:r><w:rPr><w:rFonts w:hint="eastAsia"/><w:b w:val="0"/><w:bCs/><w:sz w:val="24"/></w:rPr><w:t xml:space="preserve">${jwEsc(t)}</w:t></w:r>`;
}
function jwRunR(t) {
  return `<w:r><w:rPr><w:rFonts w:hint="eastAsia"/><w:b w:val="0"/><w:bCs/><w:color w:val="FF0000"/><w:sz w:val="24"/></w:rPr><w:t xml:space="preserve">${jwEsc(t)}</w:t></w:r>`;
}

// 表格单元格：普通段落（jc: left/center/right）
function jwCellPara(text, jc, tnr) {
  const font = tnr ? '<w:rFonts w:ascii="Times New Roman" w:hAnsi="Times New Roman" w:hint="eastAsia"/>' : '<w:rFonts w:hint="eastAsia"/>';
  const szcs = tnr ? '<w:szCs w:val="24"/>' : '';
  const run = text === "" ? "" : `<w:r><w:rPr>${font}<w:sz w:val="24"/>${szcs}</w:rPr><w:t xml:space="preserve">${jwEsc(text)}</w:t></w:r>`;
  return `<w:p><w:pPr><w:snapToGrid w:val="0"/><w:spacing w:line="260" w:lineRule="exact"/><w:jc w:val="${jc}"/><w:rPr><w:sz w:val="24"/>${szcs}</w:rPr></w:pPr>${run}</w:p>`;
}

// "1st Semester" 带上标的段落
function jwSemPara(sem) {
  const num = sem === 1 ? "1" : "2";
  const sup = sem === 1 ? "st" : "nd";
  return `<w:p><w:pPr><w:snapToGrid w:val="0"/><w:spacing w:line="260" w:lineRule="exact"/><w:jc w:val="center"/><w:rPr><w:sz w:val="24"/></w:rPr></w:pPr>` +
    `<w:r><w:rPr><w:rFonts w:hint="eastAsia"/><w:sz w:val="24"/></w:rPr><w:t>${num}</w:t></w:r>` +
    `<w:r><w:rPr><w:rFonts w:hint="eastAsia"/><w:sz w:val="24"/><w:vertAlign w:val="superscript"/></w:rPr><w:t>${sup}</w:t></w:r>` +
    `<w:r><w:rPr><w:rFonts w:hint="eastAsia"/><w:sz w:val="24"/></w:rPr><w:t xml:space="preserve"> Semester</w:t></w:r></w:p>`;
}

// 一页成绩单的正文（标题 + 兹证明 + 表格 + 说明 + 落款）。
// 多学年时每个学年单独一页，每页文字部分完全相同（certXml），仅表格不同。
function jwPageXml(certXml, dateEN, grades, courseRows) {
  // 单年级页（含按学年拆页）科目列加宽到 5000，长课名不折行；多年级页保持模板 3057
  const SUBJ_W = grades.length === 1 ? 5000 : 3057;
  let x = "";
  x += '<w:p><w:pPr><w:snapToGrid w:val="0"/><w:spacing w:line="280" w:lineRule="exact"/><w:ind w:right="440"/><w:rPr><w:szCs w:val="21"/></w:rPr></w:pPr></w:p>';
  x += '<w:p><w:pPr><w:pStyle w:val="a9"/><w:snapToGrid w:val="0"/><w:spacing w:line="340" w:lineRule="exact"/><w:rPr><w:sz w:val="32"/></w:rPr></w:pPr><w:r><w:rPr><w:rFonts w:hint="eastAsia"/><w:sz w:val="32"/></w:rPr><w:t>学生成绩登记表</w:t></w:r></w:p>';
  x += '<w:p><w:pPr><w:pStyle w:val="a9"/><w:snapToGrid w:val="0"/><w:spacing w:line="340" w:lineRule="exact"/><w:outlineLvl w:val="0"/><w:rPr><w:sz w:val="32"/></w:rPr></w:pPr><w:r><w:rPr><w:rFonts w:hint="eastAsia"/><w:sz w:val="32"/></w:rPr><w:t>Student Academic Record</w:t></w:r></w:p>';
  x += '<w:p><w:pPr><w:pStyle w:val="a9"/><w:snapToGrid w:val="0"/><w:spacing w:line="280" w:lineRule="exact"/><w:rPr><w:sz w:val="32"/></w:rPr></w:pPr></w:p>';

  // 兹证明段落（两页共用，由 jwDocumentXml 按录入信息构造）
  x += certXml;

  x += '<w:p><w:pPr><w:pStyle w:val="a9"/><w:snapToGrid w:val="0"/><w:spacing w:line="260" w:lineRule="exact"/><w:jc w:val="left"/><w:rPr><w:b w:val="0"/><w:bCs/><w:sz w:val="24"/></w:rPr></w:pPr></w:p>';

  // ── 成绩表格 ──
  // 列宽：科目列 3057，其余 5909 平分给每学期列（表格总宽 8325，与正文区左右边缘对齐）
  const nSlots = grades.length * 2;
  const slotTotal = 8325 - SUBJ_W;
  const colW = Math.floor(slotTotal / nSlots);
  const colWidths = Array.from({length: nSlots}, (_, i) => i === nSlots - 1 ? slotTotal - colW * (nSlots - 1) : colW);

  x += '<w:tbl><w:tblPr><w:tblW w:w="8325" w:type="dxa"/><w:jc w:val="center"/><w:tblBorders>' +
    '<w:top w:val="single" w:sz="4" w:space="0" w:color="auto"/><w:left w:val="single" w:sz="4" w:space="0" w:color="auto"/>' +
    '<w:bottom w:val="single" w:sz="4" w:space="0" w:color="auto"/><w:right w:val="single" w:sz="4" w:space="0" w:color="auto"/>' +
    '<w:insideH w:val="single" w:sz="4" w:space="0" w:color="auto"/><w:insideV w:val="single" w:sz="4" w:space="0" w:color="auto"/>' +
    '</w:tblBorders><w:tblLayout w:type="fixed"/><w:tblLook w:val="04A0" w:firstRow="1" w:lastRow="0" w:firstColumn="1" w:lastColumn="0" w:noHBand="0" w:noVBand="1"/></w:tblPr>';
  x += `<w:tblGrid><w:gridCol w:w="${SUBJ_W}"/>` + colWidths.map(w => `<w:gridCol w:w="${w}"/>`).join("") + '</w:tblGrid>';

  // 表头第 1 行：斜线表头 + 年级（每年级横跨 2 列）
  x += '<w:tr><w:trPr><w:cantSplit/><w:trHeight w:val="722"/><w:jc w:val="center"/></w:trPr>';
  x += `<w:tc><w:tcPr><w:tcW w:w="${SUBJ_W}" w:type="dxa"/><w:vMerge w:val="restart"/><w:tcBorders><w:tl2br w:val="single" w:sz="4" w:space="0" w:color="auto"/></w:tcBorders><w:vAlign w:val="center"/></w:tcPr>` +
    '<w:p><w:pPr><w:snapToGrid w:val="0"/><w:jc w:val="right"/><w:rPr><w:sz w:val="24"/></w:rPr></w:pPr><w:r><w:rPr><w:rFonts w:hint="eastAsia"/><w:sz w:val="24"/></w:rPr><w:t>学期 Semester</w:t></w:r></w:p>' +
    '<w:p><w:pPr><w:snapToGrid w:val="0"/><w:jc w:val="left"/><w:rPr><w:sz w:val="24"/></w:rPr></w:pPr><w:r><w:rPr><w:rFonts w:hint="eastAsia"/><w:sz w:val="24"/></w:rPr><w:t xml:space="preserve">科目 Subject</w:t></w:r></w:p></w:tc>';
  for (let gi = 0; gi < grades.length; gi++) {
    const g = grades[gi];
    const w = colWidths[gi * 2] + colWidths[gi * 2 + 1];
    x += `<w:tc><w:tcPr><w:tcW w:w="${w}" w:type="dxa"/><w:gridSpan w:val="2"/><w:vAlign w:val="center"/></w:tcPr>` +
      jwCellPara(`${JW_GRADE_CN_NUM[g] || g}年级`, "center", true) +
      jwCellPara(`Grade ${g}`, "center", true) + "</w:tc>";
  }
  x += "</w:tr>";

  // 表头第 2 行：第一/第二学期
  x += '<w:tr><w:trPr><w:cantSplit/><w:trHeight w:val="714"/><w:jc w:val="center"/></w:trPr>';
  x += `<w:tc><w:tcPr><w:tcW w:w="${SUBJ_W}" w:type="dxa"/><w:vMerge/><w:vAlign w:val="center"/></w:tcPr><w:p><w:pPr><w:snapToGrid w:val="0"/><w:spacing w:line="260" w:lineRule="exact"/><w:rPr><w:sz w:val="24"/></w:rPr></w:pPr></w:p></w:tc>`;
  for (let si = 0; si < nSlots; si++) {
    const sem = (si % 2) + 1;
    x += `<w:tc><w:tcPr><w:tcW w:w="${colWidths[si]}" w:type="dxa"/><w:vAlign w:val="center"/></w:tcPr>` +
      jwCellPara(sem === 1 ? "第一学期" : "第二学期", "center", false) +
      jwSemPara(sem) + "</w:tc>";
  }
  x += "</w:tr>";

  // 课程行
  const slotKeys = [];
  for (const g of grades) { slotKeys.push(`${g}-1`, `${g}-2`); }
  for (const row of courseRows) {
    x += '<w:tr><w:trPr><w:cantSplit/><w:trHeight w:val="340"/><w:jc w:val="center"/></w:trPr>';
    x += `<w:tc><w:tcPr><w:tcW w:w="${SUBJ_W}" w:type="dxa"/><w:vAlign w:val="center"/></w:tcPr>` + jwCellPara(row.display, "left", false) + "</w:tc>";
    for (let si = 0; si < nSlots; si++) {
      const v = row.scores.get(slotKeys[si]);
      const text = (v === undefined || v === null) ? "/" : jwScoreStr(v);
      x += `<w:tc><w:tcPr><w:tcW w:w="${colWidths[si]}" w:type="dxa"/><w:vAlign w:val="center"/></w:tcPr>` + jwCellPara(text, "center", false) + "</w:tc>";
    }
    x += "</w:tr>";
  }

  x += "</w:tbl>";

  // ── 表格之后 ──
  x += '<w:p><w:pPr><w:snapToGrid w:val="0"/><w:spacing w:line="280" w:lineRule="exact"/><w:jc w:val="left"/><w:rPr><w:sz w:val="18"/><w:szCs w:val="18"/></w:rPr></w:pPr>' +
    '<w:r><w:rPr><w:rFonts w:hint="eastAsia"/><w:sz w:val="24"/></w:rPr><w:t xml:space="preserve"> 说明(Note)：满分百分制(All scores are on a 100-point scale.)</w:t></w:r></w:p>';
  const EMPTY_R = '<w:p><w:pPr><w:snapToGrid w:val="0"/><w:spacing w:line="280" w:lineRule="exact"/><w:jc w:val="right"/><w:rPr><w:szCs w:val="21"/></w:rPr></w:pPr></w:p>';
  x += EMPTY_R + EMPTY_R;
  x += '<w:p><w:pPr><w:snapToGrid w:val="0"/><w:spacing w:line="280" w:lineRule="exact"/><w:jc w:val="right"/><w:rPr><w:szCs w:val="21"/></w:rPr></w:pPr>' +
    '<w:r><w:rPr><w:rFonts w:hint="eastAsia"/><w:szCs w:val="21"/></w:rPr><w:t>北京市朝阳区北外同文外国语学校</w:t></w:r></w:p>';
  x += '<w:p><w:pPr><w:snapToGrid w:val="0"/><w:spacing w:line="280" w:lineRule="exact"/><w:jc w:val="right"/><w:rPr><w:szCs w:val="21"/></w:rPr></w:pPr>' +
    '<w:r><w:rPr><w:szCs w:val="21"/></w:rPr><w:t>BEIJING CHAOYANG TONGWEN FOREIGN LANGUAGE SCHOOL</w:t></w:r></w:p>';
  x += '<w:p><w:pPr><w:snapToGrid w:val="0"/><w:spacing w:line="280" w:lineRule="exact"/><w:ind w:right="440"/><w:jc w:val="right"/><w:rPr><w:szCs w:val="21"/></w:rPr></w:pPr>' +
    `<w:r><w:rPr><w:rFonts w:hint="eastAsia"/><w:szCs w:val="21"/></w:rPr><w:t>${jwEsc(dateEN)}</w:t></w:r></w:p>`;
  return x;
}

// 组装整个 document.xml：pages 为每页的 {grades, courseRows}，页间插分页符。
// info（可选）为录入的学生信息 {gender, dob, idNo, startYM, status, endYM}：
// 已录入的字段以黑字写入；缺省或自动推算的保持红色占位/红字提示核对。
function jwDocumentXml(cnName, enName, semesters, pages, info) {
  info = info || {};
  const now = new Date();
  const nowCN = `${now.getFullYear()}年${now.getMonth() + 1}月`;
  const dateEN = `${JW_MONTHS_EN[now.getMonth()]} ${now.getDate()}, ${now.getFullYear()}`;

  // 入学起始：优先用录入的入学时间；否则按最早学期推算（第 1 学期≈9 月，第 2 学期≈3 月，红字）
  const first = semesters[0];
  let startCN, startEN, startAuto;
  if (info.startYM && /^\d{4}-\d{2}$/.test(info.startYM)) {
    const [sy, sm] = info.startYM.split("-").map(Number);
    startCN = `${sy}年${sm}月`;
    startEN = `${JW_MONTHS_EN[sm - 1]} ${sy}`;
    startAuto = false;
  } else {
    const [y1, y2] = first.year.split("-");
    startCN = first.sem === 1 ? `${y1}年9月` : `${y2}年3月`;
    startEN = first.sem === 1 ? `September ${y1}` : `March ${y2}`;
    startAuto = true;
  }

  const gender = (info.gender === "男" || info.gender === "女") ? info.gender : null;
  let dobCN = null, dobEN = null;
  if (info.dob && /^\d{4}-\d{2}-\d{2}$/.test(info.dob)) {
    const [dy, dm, dd] = info.dob.split("-").map(Number);
    dobCN = `${dy}年${String(dm).padStart(2, "0")}月${String(dd).padStart(2, "0")}日`;
    dobEN = `${JW_MONTHS_EN[dm - 1]} ${dd}, ${dy}`;
  }
  const idNo = String(info.idNo || "").trim() || null;
  let endCN = null, endEN = null;
  const untilEnd = info.status === "until" && info.endYM && /^\d{4}-\d{2}$/.test(info.endYM);
  if (untilEnd) {
    const [ey, em] = info.endYM.split("-").map(Number);
    endCN = `${ey}年${em}月`;
    endEN = `${JW_MONTHS_EN[em - 1]} ${ey}`;
  }

  const CERT_PPR = '<w:pPr><w:pStyle w:val="a9"/><w:snapToGrid w:val="0"/><w:spacing w:line="260" w:lineRule="exact"/><w:ind w:firstLineChars="200" w:firstLine="480"/><w:jc w:val="left"/><w:rPr><w:b w:val="0"/><w:bCs/><w:sz w:val="24"/></w:rPr></w:pPr>';

  // 中文兹证明
  let cert = `<w:p>${CERT_PPR}` +
    jwRunB("兹证明: ") +
    jwRunB(cnName) +
    jwRunB("，") + (gender ? jwRunB(gender) : jwRunR("男/女")) +
    jwRunB("，") + (dobCN ? jwRunB(dobCN) : jwRunR("XXXX年XX月XX日")) +
    jwRunB("出生，身份证: ") + (idNo ? jwRunB(idNo) : jwRunR("XXXXXXXXXXXXXXXXXX")) +
    jwRunB("，自") + (startAuto ? jwRunR(startCN) : jwRunB(startCN)) +
    (untilEnd ? jwRunB("至") + jwRunB(endCN) : jwRunB("至今") + jwRunR(`（${nowCN}）`)) +
    jwRunB("在我校就读，其学习成绩如下：") +
    "</w:p>";

  // 英文兹证明
  cert += `<w:p>${CERT_PPR}` +
    jwRunB("This is to certify that ") +
    jwRunB(enName || cnName) +
    jwRunB(", ") + (gender ? jwRunB(gender === "男" ? "male" : "female") : jwRunR("male/female")) +
    jwRunB(", born on ") + (dobEN ? jwRunB(dobEN) : jwRunR("Month DD, YYYY")) +
    jwRunB(", ID No.: ") + (idNo ? jwRunB(idNo) : jwRunR("XXXXXXXXXXXXXXXXXX")) +
    (untilEnd
      ? jwRunB(", studied at our school from ") + jwRunB(startEN) + jwRunB(" to ") + jwRunB(endEN)
      : jwRunB(", has been studying at our school since ") + (startAuto ? jwRunR(startEN) : jwRunB(startEN))) +
    jwRunB(". ") +
    (gender ? jwRunB(gender === "男" ? "His" : "Her") : jwRunR("His/Her")) +
    jwRunB(" grades are as follows:") +
    "</w:p>";

  const PAGE_BREAK = '<w:p><w:pPr><w:rPr><w:szCs w:val="21"/></w:rPr></w:pPr><w:r><w:br w:type="page"/></w:r></w:p>';
  let x = JW_DOC_OPEN + "<w:body>";
  x += pages.map(pg => jwPageXml(cert, dateEN, pg.grades, pg.courseRows)).join(PAGE_BREAK);
  x += '<w:sectPr><w:pgSz w:w="11906" w:h="16838"/><w:pgMar w:top="2835" w:right="1797" w:bottom="1440" w:left="1797" w:header="851" w:footer="992" w:gutter="0"/><w:cols w:space="425"/><w:docGrid w:type="lines" w:linePitch="312"/></w:sectPr>';
  x += "</w:body></w:document>";
  return x;
}

// ─── 教务百分制成绩单主入口 ─────
// 用 raw（校宝原始中文课程 + 百分制分数），不走美式 COURSE_MAP / EXCLUDE。
// 未在中英映射表里的课程按中文名列入，并记录到 jwUnmapped 供生成后提示。
const jwUnmapped = new Set();

// 教务版显示用课程名归一化：英语读写/听说不带级数，生物/语文不带册数
// （如"英语读写2级"→"英语读写"，"生物一册"→"生物"，"语文二册"→"语文"）
function jwNormalizeCourseCN(cn) {
  let m = cn.match(/^(英语读写|英语听说)\d+级$/);
  if (m) return m[1];
  m = cn.match(/^(生物|语文)[一二]册$/);
  if (m) return m[1];
  return cn;
}

// 从若干学期里收集课程行：按在校宝文件中首次出现的顺序排列；同名课程（归一化后）归并到一行
function jwCollectCourseRows(sems) {
  const courses = new Map(); // 归一化中文课程名 -> Map("年级-学期" -> 分数)
  for (const p of sems) {
    for (const c of (p.raw || [])) {
      const cnName = jwNormalizeCourseCN(c.courseCN);
      if (!courses.has(cnName)) courses.set(cnName, new Map());
      courses.get(cnName).set(`${p.grade}-${p.sem}`, c.score);
    }
  }
  const rows = [...courses.entries()].map(([cn, scores], idx) => {
    const en = JW_COURSE_MAP[cn];
    if (!en) jwUnmapped.add(cn);
    const display = (en && en !== cn) ? `${cn}/${en}` : cn;
    const order = JW_COURSE_ORDER[cn] !== undefined ? JW_COURSE_ORDER[cn] : 9999;
    return {display, scores, order, idx};
  });
  // 按映射表优先级排序；表外课程排最后，同序时保持首次出现顺序
  rows.sort((a, b) => (a.order - b.order) || (a.idx - b.idx));
  return rows;
}

async function generateJW(englishName, semesters, student) {
  const cnName = student && student.cn ? student.cn : "XX";
  const sems = [...semesters].sort((a, b) => a.year !== b.year ? a.year.localeCompare(b.year) : a.sem - b.sem);
  const grades = [...new Set(sems.map(s => s.grade))].sort((a, b) => a - b);

  // 超过 1 个学年：每个学年单独一页（各页文字相同，表格只含该学年 2 个学期）；
  // 单学年：保持单页
  let pages;
  if (grades.length > 1) {
    pages = grades.map(g => ({
      grades: [g],
      courseRows: jwCollectCourseRows(sems.filter(s => s.grade === g)),
    }));
  } else {
    pages = [{grades, courseRows: jwCollectCourseRows(sems)}];
  }

  const docXml = jwDocumentXml(cnName, englishName, sems, pages, student && student.info);
  const enc = new TextEncoder();
  const entries = JW_TPL_ORDER.map(name => ({
    name,
    data: enc.encode(name === "word/document.xml" ? docXml : JW_TPL_PARTS[name]),
  }));
  return jwZip(entries);
}
// ─────────────────────────────────────────────────────────
// 教务百分制成绩单 · 应用内子视图
// 多学期文件 + 学生信息录入 → 每生一份《学生成绩登记表》docx
// ─────────────────────────────────────────────────────────
const JW_GRADE_OK = new Set([9, 10, 11, 12]);
const JW_ORDINAL = {9: "9th", 10: "10th", 11: "11th", 12: "12th"};

// ─── 拼音英文名（Last, First；与独立成绩单工具同一套规则）───
const JW_SURNAME_FIX = {
  "曾": "Zeng", "单": "Shan", "解": "Xie", "查": "Zha", "覃": "Qin",
  "繁": "Po", "区": "Ou", "种": "Chong", "重": "Chong", "员": "Yun",
  "翟": "Zhai", "万俟": "Moqi", "尉迟": "Yuchi", "乐": "Yue",
  "朴": "Piao", "仇": "Qiu", "盖": "Ge", "句": "Gou",
};
const JW_FU_XING = new Set(["欧阳","上官","司马","诸葛","东方","皇甫","令狐","慕容","尉迟","长孙",
  "宇文","司徒","端木","南宫","万俟","公孙","仲孙","轩辕","公冶","赫连","澹台","闻人",
  "百里","钟离","夏侯","太史","拓跋","呼延","羊舌","微生","梁丘","左丘","东郭","西门","南门",
  "公羊","公良","乐正","壤驷","漆雕","巫马","谷梁","段干","东门","北宫","仉督","子车","颛孙"]);
function jwTitleCase(s) { return s ? s[0].toUpperCase() + s.slice(1).toLowerCase() : ""; }
function jwCnToEn(cn) {
  if (!cn || typeof pinyinPro === "undefined") return "";
  cn = cn.trim();
  if (!cn) return "";
  try {
    const surnameLen = (cn.length >= 2 && JW_FU_XING.has(cn.slice(0, 2))) ? 2 : 1;
    const surnameCn = cn.slice(0, surnameLen);
    const givenCn = cn.slice(surnameLen);
    let surnameStr;
    if (JW_SURNAME_FIX[surnameCn]) {
      surnameStr = JW_SURNAME_FIX[surnameCn];
    } else {
      const sArr = pinyinPro.pinyin(surnameCn, {pattern: "surname", toneType: "none", type: "array"});
      surnameStr = jwTitleCase(sArr.map(s => s.toLowerCase()).join(""));
    }
    let givenStr = "";
    if (givenCn) {
      const gArr = pinyinPro.pinyin(givenCn, {toneType: "none", type: "array"});
      givenStr = jwTitleCase(gArr.map(s => s.toLowerCase()).join(""));
    }
    return givenStr ? `${surnameStr}, ${givenStr}` : surnameStr;
  } catch (err) {
    console.warn("pinyin error:", err);
    return "";
  }
}

// ─── 班级名年级解析（含班名年份前缀校正）───
// 校宝导出的班级列显示学生"当前"行政班名（升级后班名跟着变），
// 校正：真实年级 = 班名年级 - (班名学年起始年 - 成绩学期学年起始年)。
// 前缀 "24" / "24秋" = 2024-2025 学年，"25春" 属上一学年 = 2024-2025 学年。
function jwGradesInClassName(name, semStartYear) {
  const out = [];
  let offset = 0;
  const s = String(name);
  const pm = s.match(/^\s*(\d{2})(春|秋)?(?=\D|$)/);
  if (pm && semStartYear) {
    let clsYear = 2000 + Number(pm[1]);
    if (pm[2] === "春") clsYear -= 1;
    const diff = clsYear - semStartYear;
    if (diff >= -1 && diff <= 3) offset = diff;
  }
  for (const m of s.matchAll(/(\d+)年级/g)) {
    out.push(Number(m[1]) - offset);
  }
  return out;
}

// ─── 解析一个学期文件里目标学生的成绩 ───
function jwParseSemFile(parsedSheets, sheetNames, targetCn) {
  for (const sheetName of sheetNames) {
    const rows = parsedSheets[sheetName];
    if (!rows || !rows.length) continue;

    let semStr = "";
    const classCells = [];
    for (const row of rows) {
      const c0 = String(row[0] ?? "").trim();
      if (c0 === "学期" && !semStr) {
        for (let ci = 1; ci < row.length; ci++) {
          const v = String(row[ci] ?? "").trim();
          if (v) { semStr = v; break; }
        }
      }
      if (c0 === "班级" && !classCells.length) {
        for (let ci = 1; ci < row.length; ci++) {
          const v = String(row[ci] ?? "").trim();
          if (v) classCells.push(v);
        }
      }
      if (semStr && classCells.length) break;
    }

    const ym = semStr.match(/(\d{4}-\d{4})学年/);
    const sm = semStr.match(/第(\d)学期/);
    if (!ym || !sm) continue;
    const year = ym[1];
    const sem = Number(sm[1]);
    const semStartYear = Number(year.slice(0, 4));

    const gradeCounts = new Map();
    for (const cell of classCells) {
      for (const g of jwGradesInClassName(cell, semStartYear)) {
        gradeCounts.set(g, (gradeCounts.get(g) || 0) + 1);
      }
    }
    if (!gradeCounts.size) continue;
    let grade = null, maxCount = -1;
    for (const [g, c] of [...gradeCounts.entries()].sort((a, b) => a[0] - b[0])) {
      if (c > maxCount) { maxCount = c; grade = g; }
    }
    if (!JW_GRADE_OK.has(grade)) continue;

    let matchedCn = null;
    const courses = [];
    for (let i = 0; i < rows.length; i++) {
      if (String(rows[i][0] ?? "").trim() !== "学号") continue;
      for (let j = i + 1; j < Math.min(i + 5, rows.length); j++) {
        const c1 = String(rows[j][1] ?? "").trim();
        const c3 = String(rows[j][3] ?? "").trim();
        if (!c1 || c1 === "学生中文名") continue;
        if (!c3 || c3 === "课程") continue;
        if (c1 !== targetCn) break;
        matchedCn = c1;
        const v = rows[j][5];
        if (v === "" || v === null || v === undefined) break;
        if (v === "未学习" || v === "不考核" || v === "缺考") break;
        const num = Number(v);
        if (isNaN(num)) break;
        let richness = 0;
        for (let k = 9; k < rows[j].length; k++) {
          const cell = rows[j][k];
          if (cell !== "" && cell !== null && cell !== undefined) richness++;
        }
        courses.push({courseCN: c3, score: num, richness});
        break;
      }
    }

    if (courses.length > 1) {
      const byName = new Map();
      for (const c of courses) {
        const prev = byName.get(c.courseCN);
        if (!prev || c.richness > prev.richness ||
            (c.richness === prev.richness && c.score > prev.score)) {
          byName.set(c.courseCN, c);
        }
      }
      courses.length = 0;
      for (const c of byName.values()) courses.push({courseCN: c.courseCN, score: c.score});
    } else if (courses.length === 1) {
      courses[0] = {courseCN: courses[0].courseCN, score: courses[0].score};
    }

    if (matchedCn && courses.length) {
      return {year, sem, grade, label: `${JW_ORDINAL[grade]}, ${year}  Sem ${sem}`, raw: courses};
    }
  }
  return null;
}

// 不依赖学生，从文件提取学期标签（文件列表显示用）
function jwExtractFileSemLabel(parsedSheets, sheetNames) {
  try {
    for (const sheetName of sheetNames) {
      const rows = parsedSheets[sheetName];
      if (!rows) continue;
      let semStr = "";
      const classCells = [];
      for (const row of rows) {
        const c0 = String(row[0] ?? "").trim();
        if (c0 === "学期" && !semStr) {
          for (let ci = 1; ci < row.length; ci++) {
            const v = String(row[ci] ?? "").trim();
            if (v) { semStr = v; break; }
          }
        }
        if (c0 === "班级" && !classCells.length) {
          for (let ci = 1; ci < row.length; ci++) {
            const v = String(row[ci] ?? "").trim();
            if (v) classCells.push(v);
          }
        }
        if (semStr && classCells.length) break;
      }
      const ym = semStr.match(/(\d{4}-\d{4})学年/);
      const sm = semStr.match(/第(\d)学期/);
      if (ym && sm) {
        const semStartYear = Number(ym[1].slice(0, 4));
        const counts = new Map();
        for (const cell of classCells) {
          for (const g of jwGradesInClassName(cell, semStartYear)) {
            counts.set(g, (counts.get(g) || 0) + 1);
          }
        }
        let grade = null, maxCount = -1;
        for (const [g, c] of [...counts.entries()].sort((a, b) => a[0] - b[0])) {
          if (c > maxCount) { maxCount = c; grade = g; }
        }
        if (grade !== null && JW_GRADE_OK.has(grade)) {
          return `${JW_ORDINAL[grade]}, ${ym[1]}  Sem ${sm[1]}`;
        }
      }
    }
  } catch {}
  return null;
}

// ─── 子视图状态 ───
let jwFiles = [];       // {name, parsedSheets, sheetNames, semLabel, error, seeded}
let jwStudents = [];    // {cn, en, enAuto, enOverride, gender, dob, idNo, startYM, status, endYM}
let jwSeedFile = null;  // 首页上传的文件，进入子视图时自动带入
let jwActive = 0;       // 当前预览的学生索引
let jwStatusMsg = "";

const JW_MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];

function jwNewStudent() {
  return {cn: "", en: "", enAuto: "", enOverride: null, gender: "", dob: "", idNo: "", startYM: "", status: "current", endYM: ""};
}

function jwStashSeed(data, fname) {
  try {
    const wb = XLSX.read(data, {type: "array"});
    const parsedSheets = {};
    for (const sn of wb.SheetNames) {
      parsedSheets[sn] = XLSX.utils.sheet_to_json(wb.Sheets[sn], {header: 1, defval: ""});
    }
    jwSeedFile = {name: fname, parsedSheets, sheetNames: wb.SheetNames.slice(), error: null, seeded: true};
    jwSeedFile.semLabel = jwExtractFileSemLabel(parsedSheets, jwSeedFile.sheetNames);
    jwFiles = jwFiles.filter(f => !f.seeded);
  } catch {}
}

function openJW() {
  history.pushState({view: 'preview'}, '');
  if (jwSeedFile && !jwFiles.some(f => f.name === jwSeedFile.name)) {
    jwFiles.unshift(jwSeedFile);
  }
  if (!jwStudents.length) jwStudents.push(jwNewStudent());
  if (jwActive >= jwStudents.length) jwActive = 0;
  jwStatusMsg = "";
  drawJW();
  window.scrollTo({top: document.querySelector('.wrap').offsetTop, behavior: 'smooth'});
  document.querySelector('.wrap').classList.add('preview-mode');
}

async function jwAddFiles(fileList) {
  for (const f of Array.from(fileList)) {
    if (jwFiles.some(x => x.name === f.name)) continue;
    const item = {name: f.name, parsedSheets: null, sheetNames: null, semLabel: null, error: null};
    jwFiles.push(item);
    try {
      const buffer = await f.arrayBuffer();
      const wb = XLSX.read(new Uint8Array(buffer), {type: "array"});
      item.sheetNames = wb.SheetNames.slice();
      item.parsedSheets = {};
      for (const sn of wb.SheetNames) {
        item.parsedSheets[sn] = XLSX.utils.sheet_to_json(wb.Sheets[sn], {header: 1, defval: ""});
      }
      item.semLabel = jwExtractFileSemLabel(item.parsedSheets, item.sheetNames);
    } catch (err) {
      item.error = err.message;
    }
  }
  drawJW();
}

function jwStep1Done() { return jwStudents.some(s => s.cn.trim()); }
function jwStep2Done() { return jwFiles.some(f => f.parsedSheets && !f.error); }

function jwCanGen() {
  return jwStudents.some(s => s.cn.trim()) && jwFiles.some(f => f.parsedSheets && !f.error);
}

function jwEscHtml(s) {
  return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}

// ─── 视图骨架 ───

    h += `<div class="jw-f"><label>身份证号</label><input data-i="${i}" data-k="idNo" value="${jwEscHtml(s.idNo)}" placeholder="留空则占位"></div>`;

function jwSyncGenerate() {
  const btn = document.getElementById("jwGenBtn");
  if (!btn) return;
  btn.disabled = !jwCanGen();
  btn.textContent = "导出成绩单";
}

function jwBindEvents() {
  const drop = document.getElementById("jwDrop");
  const input = document.getElementById("jwFileInput");
  drop.addEventListener("click", () => input.click());
  drop.addEventListener("dragover", e => { e.preventDefault(); drop.classList.add("over"); });
  drop.addEventListener("dragleave", () => drop.classList.remove("over"));
  drop.addEventListener("drop", e => {
    e.preventDefault(); drop.classList.remove("over");
    jwAddFiles(e.dataTransfer.files);
  });
  input.addEventListener("change", e => {
    if (e.target.files.length) jwAddFiles(e.target.files);
    input.value = "";
  });
  document.querySelectorAll(".jw-file-x").forEach(el => {
    el.onclick = () => { jwFiles.splice(Number(el.dataset.i), 1); drawJW(); };
  });
  document.querySelectorAll(".jw-stu-x").forEach(el => {
    el.onclick = ev => {
      ev.stopPropagation();
      jwStudents.splice(Number(el.dataset.i), 1);
      if (!jwStudents.length) jwStudents.push(jwNewStudent());
      if (jwActive >= jwStudents.length) jwActive = jwStudents.length - 1;
      drawJW();
    };
  });
  // 点学生卡切换预览对象
  document.querySelectorAll(".jw-stu").forEach(el => {
    el.addEventListener("click", () => {
      const i = Number(el.dataset.stu);
      if (i !== jwActive) {
        jwActive = i;
        document.querySelectorAll(".jw-stu").forEach(x => x.classList.toggle("active", Number(x.dataset.stu) === i));
        jwRenderPreview();
      }
    });
  });
  document.getElementById("jwAddStu").onclick = () => {
    jwStudents.push(jwNewStudent());
    jwActive = jwStudents.length - 1;
    drawJW();
  };

  // 字段输入：只更新状态 + 预览，不整页重绘（避免丢焦点）
  document.querySelectorAll(".jw-stu [data-k]").forEach(el => {
    const i = Number(el.dataset.i), k = el.dataset.k;
    el.addEventListener(el.tagName === "SELECT" ? "change" : "input", () => {
      const s = jwStudents[i];
      if (!s) return;
      const v = el.value;
      if (k === "cn") {
        s.cn = v;
        s.enAuto = jwCnToEn(v.trim());
        if (!s.enOverride) {
          s.en = s.enAuto;
          const enEl = document.querySelector(`.jw-stu input[data-i="${i}"][data-k="en"]`);
          if (enEl) { enEl.value = s.enAuto; enEl.placeholder = s.enAuto || "Last, First"; }
        }
        jwSyncGenerate();
        const chip = document.getElementById("jwStepNum1");
        if (chip) {
          const done = jwStep1Done();
          chip.classList.toggle("done", done);
          chip.textContent = done ? "✓" : "1";
        }
      } else if (k === "en") {
        s.en = v.trim();
        s.enOverride = (v.trim() && v.trim() !== s.enAuto) ? v.trim() : null;
        if (!v.trim()) s.en = s.enAuto;
      } else if (k === "status") {
        s.status = v;
        const wrap = document.querySelector(`.jw-endym[data-i="${i}"]`);
        if (wrap) wrap.style.visibility = v === "until" ? "visible" : "hidden";
      } else {
        s[k] = v;
      }
      if (i !== jwActive) {
        jwActive = i;
        document.querySelectorAll(".jw-stu").forEach(x => x.classList.toggle("active", Number(x.dataset.stu) === i));
      }
      jwRenderPreview();
    });
  });
}

// ─── 实时预览：镜像 docx 生成逻辑（黑字=已录入，红字=占位/待核对）───
function jwRenderPreview() {
  const stage = document.getElementById("jwStage");
  if (!stage) return;
  const s = jwStudents[jwActive] || jwNewStudent();
  const cn = s.cn.trim();

  // 收集该生学期数据
  let sems = [];
  if (cn) {
    for (const f of jwFiles) {
      if (!f.parsedSheets || f.error) continue;
      try {
        const r = jwParseSemFile(f.parsedSheets, f.sheetNames, cn);
        if (r) sems.push(r);
      } catch {}
    }
    sems.sort((a, b) => a.year !== b.year ? a.year.localeCompare(b.year) : a.sem - b.sem);
  }
  const grades = [...new Set(sems.map(x => x.grade))].sort((a, b) => a - b);

  // 文案片段（与 jwDocumentXml 同一套规则）
  const B = t => jwEscHtml(t);
  const R = t => `<span class="red">${jwEscHtml(t)}</span>`;
  const now = new Date();
  const nowCN = `${now.getFullYear()}年${now.getMonth() + 1}月`;
  const dateEN = `${JW_MONTHS[now.getMonth()]} ${now.getDate()}, ${now.getFullYear()}`;
  let startCN, startEN, startAuto;
  if (s.startYM && /^\d{4}-\d{2}$/.test(s.startYM)) {
    const [sy, sm] = s.startYM.split("-").map(Number);
    startCN = `${sy}年${sm}月`; startEN = `${JW_MONTHS[sm - 1]} ${sy}`; startAuto = false;
  } else if (sems.length) {
    const first = sems[0];
    const [y1, y2] = first.year.split("-");
    startCN = first.sem === 1 ? `${y1}年9月` : `${y2}年3月`;
    startEN = first.sem === 1 ? `September ${y1}` : `March ${y2}`;
    startAuto = true;
  } else {
    startCN = "XXXX年X月"; startEN = "Month YYYY"; startAuto = true;
  }
  const gender = (s.gender === "男" || s.gender === "女") ? s.gender : null;
  let dobCN = null, dobEN = null;
  if (s.dob && /^\d{4}-\d{2}-\d{2}$/.test(s.dob)) {
    const [dy, dm, dd] = s.dob.split("-").map(Number);
    dobCN = `${dy}年${String(dm).padStart(2, "0")}月${String(dd).padStart(2, "0")}日`;
    dobEN = `${JW_MONTHS[dm - 1]} ${dd}, ${dy}`;
  }
  const idNo = s.idNo.trim() || null;
  let endCN = null, endEN = null;
  const untilEnd = s.status === "until" && s.endYM && /^\d{4}-\d{2}$/.test(s.endYM);
  if (untilEnd) {
    const [ey, em] = s.endYM.split("-").map(Number);
    endCN = `${ey}年${em}月`; endEN = `${JW_MONTHS[em - 1]} ${ey}`;
  }
  const en = (s.en || s.enAuto || "").trim();

  const certCN = B("兹证明: ") + B(cn || "XX") +
    B("，") + (gender ? B(gender) : R("男/女")) +
    B("，") + (dobCN ? B(dobCN) : R("XXXX年XX月XX日")) +
    B("出生，身份证: ") + (idNo ? B(idNo) : R("XXXXXXXXXXXXXXXXXX")) +
    B("，自") + (startAuto ? R(startCN) : B(startCN)) +
    (untilEnd ? B("至") + B(endCN) : B("至今") + R(`（${nowCN}）`)) +
    B("在我校就读，其学习成绩如下：");
  const hisHer = gender ? (gender === "男" ? "His" : "Her") : null;
  const certEN = B("This is to certify that ") + B(en || cn || "XX") +
    B(", ") + (gender ? B(gender === "男" ? "male" : "female") : R("male/female")) +
    B(", born on ") + (dobEN ? B(dobEN) : R("Month DD, YYYY")) +
    B(", ID No.: ") + (idNo ? B(idNo) : R("XXXXXXXXXXXXXXXXXX")) +
    (untilEnd
      ? B(", studied at our school from ") + B(startEN) + B(" to ") + B(endEN)
      : B(", has been studying at our school since ") + (startAuto ? R(startEN) : B(startEN))) +
    B(". ") + (hisHer ? B(hisHer) : R("His/Her")) + B(" grades are as follows:");

  const GRADE_CN = {9: "九", 10: "十", 11: "十一", 12: "十二"};
  const pages = grades.length ? grades.map(g => ({g, sems: sems.filter(x => x.grade === g)})) : [null];

  let h = "";
  // 预览说明 + 学生页签
  h += `<div class="jw-stage-head">`;
  h += `<span class="jw-stage-label">实时预览</span>`;
  if (jwStudents.filter(x => x.cn.trim()).length > 1 || jwStudents.length > 1) {
    h += `<div class="jw-tabs">`;
    jwStudents.forEach((x, i) => {
      h += `<button class="jw-tab${i === jwActive ? " on" : ""}" data-i="${i}">${jwEscHtml(x.cn.trim() || `学生 ${i + 1}`)}</button>`;
    });
    h += `</div>`;
  }
  h += `<div class="jw-stage-right">`;
  if (grades.length > 1) h += `<span class="jw-stage-note">共 ${grades.length} 页（每学年一页）</span>`;
  h += `<button class="jw-export" id="jwGenBtn"${jwCanGen() ? "" : " disabled"}>导出成绩单</button>`;
  h += `</div>`;
  h += `</div>`;
  h += `<div id="jwMsgs">${jwStatusMsg}</div>`;

  for (const pg of pages) {
    h += `<div class="jw-paper">`;
    h += `<div class="jwp-title">学生成绩登记表</div>`;
    h += `<div class="jwp-title-en">Student Academic Record</div>`;
    h += `<p class="jwp-cert">${certCN}</p>`;
    h += `<p class="jwp-cert jwp-cert-en">${certEN}</p>`;
    if (pg) {
      h += `<table class="jwp-table"><thead>`;
      h += `<tr><th rowspan="2" class="jwp-diag"><span>学期 Semester</span><span>科目 Subject</span></th>`;
      h += `<th colspan="2">${GRADE_CN[pg.g] || pg.g}年级<br>Grade ${pg.g}</th></tr>`;
      h += `<tr><th>第一学期<br>1<sup>st</sup> Semester</th><th>第二学期<br>2<sup>nd</sup> Semester</th></tr></thead><tbody>`;
      const rows = jwCollectCourseRows(pg.sems);
      for (const r of rows) {
        const v1 = r.scores.get(`${pg.g}-1`);
        const v2 = r.scores.get(`${pg.g}-2`);
        h += `<tr><td class="subj">${jwEscHtml(r.display)}</td><td>${v1 === undefined ? "/" : jwScoreStr(v1)}</td><td>${v2 === undefined ? "/" : jwScoreStr(v2)}</td></tr>`;
      }
      h += `</tbody></table>`;
      h += `<div class="jwp-note">说明(Note)：满分百分制(All scores are on a 100-point scale.)</div>`;
    } else {
      h += `<div class="jwp-placeholder">${jwFiles.some(f => f.parsedSheets && !f.error)
        ? (cn ? "在已上传的文件中未找到「" + jwEscHtml(cn) + "」的成绩" : "输入学生中文姓名后，此处显示成绩表格")
        : "上传学期成绩文件后，此处显示成绩表格"}</div>`;
    }
    h += `<div class="jwp-sign">北京市朝阳区北外同文外国语学校<br>BEIJING CHAOYANG TONGWEN FOREIGN LANGUAGE SCHOOL<br>${dateEN}</div>`;
    h += `</div>`;
  }
  stage.innerHTML = h;
  const genBtn = stage.querySelector("#jwGenBtn");
  if (genBtn) genBtn.onclick = jwGenerateAll;
  stage.querySelectorAll(".jw-tab").forEach(el => {
    el.onclick = () => {
      jwActive = Number(el.dataset.i);
      document.querySelectorAll(".jw-stu").forEach(x => x.classList.toggle("active", Number(x.dataset.stu) === jwActive));
      jwRenderPreview();
    };
  });
}

async function jwGenerateAll() {
  const students = jwStudents.filter(s => s.cn.trim());
  const btn = document.getElementById("jwGenBtn");
  const original = btn.textContent;
  jwUnmapped.clear();
  const misses = [];
  let msg = "";
  try {
    btn.disabled = true;
    let done = 0;
    for (let i = 0; i < students.length; i++) {
      const s = students[i];
      const cn = s.cn.trim();
      btn.textContent = `生成中 ${i + 1}/${students.length}：${cn}...`;
      const sems = [];
      for (const f of jwFiles) {
        if (!f.parsedSheets || f.error) continue;
        try {
          const r = jwParseSemFile(f.parsedSheets, f.sheetNames, cn);
          if (r) sems.push(r);
        } catch {}
      }
      if (!sems.length) { misses.push(cn); continue; }
      sems.sort((a, b) => a.year !== b.year ? a.year.localeCompare(b.year) : a.sem - b.sem);
      const en = (s.en || s.enAuto || jwCnToEn(cn)).trim();
      const info = {gender: s.gender, dob: s.dob, idNo: s.idNo, startYM: s.startYM, status: s.status, endYM: s.endYM};
      const blob = await generateJW(en, sems, {cn, info});
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = `${cn}教务百分制成绩单.docx`;
      a.click();
      await new Promise(r => setTimeout(r, 300));
      URL.revokeObjectURL(a.href);
      done++;
    }
    msg = `<div class="jw-msg ok">已生成 ${done}/${students.length} 份成绩单。</div>`;
    if (misses.length) msg += `<div class="jw-msg bad">以下学生在所有文件中均未找到：${misses.join("、")}</div>`;
    if (jwUnmapped.size) msg += `<div class="jw-msg warn">以下课程不在中英课程映射表里，已按中文名列入，请人工核对：${[...jwUnmapped].join("、")}</div>`;
  } catch (err) {
    msg = `<div class="jw-msg bad">生成失败：${err.message}</div>`;
    console.error(err);
  } finally {
    jwStatusMsg = msg;
    btn.textContent = original;
    jwRenderPreview();
  }
}
</script>
